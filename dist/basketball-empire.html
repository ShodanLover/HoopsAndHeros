<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e1d">
<meta name="description" content="Basketball Empire — build a basketball dynasty from a cracked neighborhood court to the Basketball Multiverse.">
<title>Basketball Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap">
<style>
/* Basketball Empire — arena-night visual system.
   Layout: one-column mobile game shell — HUD / screen / tab bar; modals rise as bottom sheets. */
:root {
  --bg: #0a0e1d;
  --bg2: #10162c;
  --panel: #161e3b;
  --panel2: #1d2750;
  --panel3: #26326a;
  --line: rgba(190, 205, 255, 0.1);
  --fg: #f2f4ff;
  --muted: #98a2c9;
  --dim: #66709a;
  --accent: #ff7a2f;
  --accent-deep: #c9481a;
  --gold: #ffd23f;
  --gold-deep: #c99700;
  --good: #38d996;
  --bad: #ff5a6a;
  --info: #3aa8ff;
  --gem: #c07bff;
  --r0: #a9b4c2; --r1: #38d996; --r2: #3aa8ff; --r3: #b46bff; --r4: #ffb22e; --r5: #ff3f7a;
  --display: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cond: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: dark; } }
:root[data-theme="light"] { color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.35;
  overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(255, 122, 47, 0.14), transparent 60%),
    radial-gradient(800px 400px at 50% 110%, rgba(58, 168, 255, 0.1), transparent 60%);
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hidden { display: none !important; }
svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }

#app {
  position: relative; z-index: 1; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(16, 22, 44, 0.9), rgba(10, 14, 29, 0.96));
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
}

/* ---------- HUD ---------- */
#hud {
  display: flex; align-items: center; gap: 6px; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  background: linear-gradient(180deg, #121a36, #0e1430); border-bottom: 1px solid var(--line); z-index: 5;
}
.franchise-chip { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1 1 auto; text-align: left; }
.crest {
  width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center;
  font-family: var(--display); font-size: 19px; color: #fff; letter-spacing: 0.5px;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.4);
}
.franchise-chip .fname { font-family: var(--cond); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.franchise-chip .fsub { font-size: 11px; color: var(--muted); font-family: var(--cond); white-space: nowrap; }
.cur {
  display: flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 8px 4px 5px; font-family: var(--cond); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
  flex: none; position: relative;
}
.cur .ico { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
.cur.cash .ico { background: var(--good); color: #063; }
.cur.gems .ico { background: var(--gem); color: #fff; }
.cur.tix .ico { background: var(--gold); color: #5a3d00; }
.cur.bump { animation: bump 0.35s ease; }
@keyframes bump { 40% { transform: scale(1.15); } }
.hud-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); font-size: 18px; flex: none; }

/* ---------- Screens ---------- */
#screens { flex: 1; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overflow-anchor: none; padding: 10px 12px 18px; display: none; -webkit-overflow-scrolling: touch; }
.screen.active { display: block; animation: fadeIn 0.18s ease; }
#scr-play { padding: 8px 12px 18px; display: none; flex-direction: column; gap: 8px; }
#scr-play.active { display: flex; }
/* Pinned arena: stage header, court, abilities and objective stay on screen on every tab */
#arena { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 6px 10px 6px; background: rgba(0, 0, 0, 0.18); border-bottom: 1px solid var(--line); z-index: 2; }
#arena .court-wrap { height: clamp(190px, 34vh, 320px); min-height: 0; max-height: none; flex: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

/* ---------- Nav ---------- */
#nav {
  display: grid; grid-template-columns: repeat(5, 1fr); background: #0c1128; border-top: 1px solid var(--line);
  padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  z-index: 5;
}
.nav-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0 4px; color: var(--dim); font-family: var(--cond); font-weight: 700; font-size: 11.5px; letter-spacing: 0.6px; text-transform: uppercase; border-radius: 12px; }
.nav-btn svg { width: 24px; height: 24px; transition: transform 0.15s; }
.nav-btn.active { color: var(--fg); background: rgba(255, 122, 47, 0.12); }
.nav-btn.active svg { color: var(--accent); transform: translateY(-1px) scale(1.06); }
.nav-btn.locked { opacity: 0.35; }
.badge { position: absolute; top: 3px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px #0c1128; font-family: var(--body); }
.dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--bg2); }

/* ---------- Buttons ---------- */
.btn {
  --c1: var(--accent); --c2: var(--accent-deep);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px;
  border-radius: 12px; font-family: var(--cond); font-weight: 800; font-size: 16px; letter-spacing: 0.4px; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, var(--c1), var(--c2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 0 rgba(0, 0, 0, 0.35);
  transition: transform 0.06s, filter 0.15s; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); white-space: nowrap;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 0 rgba(0, 0, 0, 0.35); }
.btn[disabled], .btn.disabled { filter: grayscale(0.85) brightness(0.6); cursor: not-allowed; }
.btn.gold { --c1: #ffd23f; --c2: #d89a00; color: #3d2a00; text-shadow: none; }
.btn.green { --c1: #3be3a0; --c2: #149a63; }
.btn.blue { --c1: #48b2ff; --c2: #1866c9; }
.btn.purple { --c1: #c98bff; --c2: #7b35d6; }
.btn.ghost { background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 1px var(--line); }
.btn.sm { min-height: 34px; padding: 5px 10px; font-size: 14px; border-radius: 10px; }
.btn.xs { min-height: 28px; padding: 3px 8px; font-size: 12.5px; border-radius: 8px; }
.btn.wide { width: 100%; }
.btn .sub { display: block; font-size: 11px; font-weight: 700; opacity: 0.9; letter-spacing: 0; }
.btn.stack { flex-direction: column; gap: 0; line-height: 1.05; }
.btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 0 rgba(0, 0, 0, 0.35), 0 0 0 6px rgba(255, 210, 63, 0.25); } }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); font-size: 20px; flex: none; }

/* ---------- Generic UI ---------- */
.h1 { font-family: var(--display); font-size: 30px; letter-spacing: 1px; line-height: 1; margin: 0; text-wrap: balance; }
.h2 { font-family: var(--display); font-size: 22px; letter-spacing: 0.8px; line-height: 1.05; margin: 0; }
.h3 { font-family: var(--cond); font-weight: 800; font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase; margin: 0; }
.label { font-family: var(--cond); font-weight: 700; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { font-family: var(--cond); font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.card { background: linear-gradient(180deg, var(--panel), #131a35); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.card.flat { background: rgba(255, 255, 255, 0.03); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 2px 8px; gap: 8px; }
.sec-title:first-child { margin-top: 2px; }
.bar { position: relative; height: 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width 0.35s ease; }
.bar.green > i { background: linear-gradient(90deg, #149a63, var(--good)); }
.bar.blue > i { background: linear-gradient(90deg, #1866c9, var(--info)); }
.bar.purple > i { background: linear-gradient(90deg, #7b35d6, var(--gem)); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: 0.3px; white-space: nowrap; }
.chip.gold { background: rgba(255, 210, 63, 0.15); color: var(--gold); }
.chip.good { background: rgba(56, 217, 150, 0.14); color: var(--good); }
.chip.bad { background: rgba(255, 90, 106, 0.14); color: var(--bad); }
.chip.info { background: rgba(58, 168, 255, 0.14); color: var(--info); }
.tabs { display: flex; gap: 4px; background: rgba(0, 0, 0, 0.3); padding: 4px; border-radius: 12px; margin-bottom: 10px; position: sticky; top: -10px; z-index: 3; backdrop-filter: blur(6px); }
.tab { flex: 1; padding: 8px 4px; border-radius: 9px; font-family: var(--cond); font-weight: 800; font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); position: relative; }
.tab.active { background: var(--panel3); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.lock-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.dev-banner { background: repeating-linear-gradient(-45deg, rgba(255, 210, 63, 0.12) 0 10px, rgba(255, 210, 63, 0.05) 10px 20px); border: 1px dashed rgba(255, 210, 63, 0.55); color: var(--gold); border-radius: 12px; padding: 9px 11px; font-size: 12.5px; }
.dev-banner b { font-family: var(--cond); letter-spacing: 0.6px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv > :nth-child(even) { text-align: right; font-family: var(--cond); font-weight: 700; }
.divider { height: 1px; background: var(--line); margin: 8px 0; }

/* ---------- Play screen ---------- */
.stagebar { display: flex; align-items: center; gap: 8px; }
.stagebar .wname { font-family: var(--display); font-size: 20px; letter-spacing: 0.8px; line-height: 1; }
.stagebar .wsub { font-family: var(--cond); font-weight: 600; font-size: 12px; color: var(--muted); }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pip { width: 16px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); }
.pip.done { background: var(--good); }
.pip.cur { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: blink 1.2s ease-in-out infinite; }
.pip.champ { width: 22px; background: rgba(255, 210, 63, 0.25); }
.pip.champ.done { background: var(--gold); }
@keyframes blink { 50% { opacity: 0.55; } }
.hub { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px 1px 2px; }
.hub::-webkit-scrollbar { display: none; }
.hub-btn { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 58px; padding: 6px 0 5px; border-radius: 12px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); font-family: var(--cond); font-weight: 700; font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
.hub-btn svg { width: 22px; height: 22px; color: var(--fg); }
.hub-btn.hot svg { color: var(--gold); }
.objective { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; background: linear-gradient(90deg, rgba(255, 122, 47, 0.18), rgba(255, 122, 47, 0.04)); border: 1px solid rgba(255, 122, 47, 0.35); font-size: 12.5px; text-align: left; width: 100%; }
.objective .oi { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; font-size: 15px; }
.objective b { font-family: var(--cond); font-size: 13.5px; letter-spacing: 0.3px; }
.court-wrap { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #000; flex: 1 1 auto; min-height: 220px; max-height: 470px; box-shadow: var(--shadow); }
.court-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scoreboard { position: absolute; left: 8px; right: 8px; top: 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; background: rgba(6, 8, 18, 0.78); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 5px 8px; backdrop-filter: blur(4px); pointer-events: none; }
.sb-team { display: flex; align-items: center; gap: 6px; min-width: 0; }
.sb-team.away { flex-direction: row-reverse; text-align: right; }
.sb-sw { width: 8px; height: 26px; border-radius: 3px; flex: none; }
.sb-name { font-family: var(--cond); font-weight: 700; font-size: 12px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-pow { font-size: 10.5px; color: var(--muted); font-family: var(--cond); white-space: nowrap; }
.sb-score { font-family: var(--display); font-size: 30px; line-height: 1; min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.sb-score.pop { animation: pop 0.4s ease; }
@keyframes pop { 30% { transform: scale(1.35); color: var(--gold); } }
.sb-mid { text-align: center; font-family: var(--cond); font-weight: 700; font-size: 11px; color: var(--muted); line-height: 1.1; }
.sb-mid .q { color: var(--fg); font-size: 13px; }
.court-overlay { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 8px; padding: 0 10px; flex-wrap: wrap; }
.wall-hint { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(6, 8, 18, 0.85); border: 1px solid rgba(255, 90, 106, 0.45); border-radius: 12px; padding: 7px 10px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
.result-pop { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.result-pop .rp { text-align: center; animation: resultIn 0.5s cubic-bezier(.2, 1.4, .4, 1); }
.result-pop .rp .big { font-family: var(--display); font-size: 56px; letter-spacing: 2px; line-height: 0.9; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45), 0 0 30px currentColor; }
.result-pop .rp .rw { margin-top: 6px; display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
@keyframes resultIn { from { transform: scale(0.4); opacity: 0; } }
.controls { display: flex; gap: 6px; align-items: stretch; }
.energy { display: flex; flex-direction: column; gap: 3px; justify-content: center; width: 56px; flex: none; }
.energy .bar { height: 7px; }
.energy .bar > i { background: linear-gradient(90deg, #ff7a2f, #ffd23f); }
.abil { position: relative; flex: 1; min-width: 0; min-height: 50px; border-radius: 12px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--cond); font-weight: 800; font-size: 11.5px; letter-spacing: 0.3px; text-transform: uppercase; background: linear-gradient(180deg, var(--panel3), var(--panel2)); border: 1px solid var(--line); color: var(--fg); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.abil svg { width: 20px; height: 20px; }
.abil .cost { font-size: 10px; color: var(--muted); font-weight: 700; }
.abil.ready { border-color: var(--ab); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 0 14px -2px var(--ab); }
.abil.ready svg { color: var(--ab); }
.abil:disabled { opacity: 0.45; }
.abil:active:not(:disabled) { transform: translateY(2px); }
.abil.active::after { content: ""; position: absolute; inset: -2px; border-radius: 13px; border: 2px solid var(--ab); animation: blink 0.8s infinite; }
.ticker { min-height: 38px; background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; color: #dfe4ff; display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
.ticker .tl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker .tl:first-child { color: #fff; font-weight: 600; }
.ticker .tl + .tl { opacity: 0.55; font-size: 11.5px; }
.toolbar { display: flex; gap: 6px; align-items: center; }
.toolbar .chip { cursor: pointer; padding: 6px 9px; font-size: 12px; }
.toolbar .chip.on { background: rgba(255, 122, 47, 0.2); color: var(--accent); }
.income { font-family: var(--cond); font-size: 12px; color: var(--muted); text-align: right; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.income b { color: var(--good); }

/* ---------- Athlete cards ---------- */
.rar { --rc: var(--r0); }
.rar.r1 { --rc: var(--r1); } .rar.r2 { --rc: var(--r2); } .rar.r3 { --rc: var(--r3); } .rar.r4 { --rc: var(--r4); } .rar.r5 { --rc: var(--r5); }
.acard { position: relative; border-radius: 14px; padding: 2px; background: linear-gradient(160deg, var(--rc), rgba(0, 0, 0, 0.3) 45%, var(--rc)); text-align: left; display: block; width: 100%; }
.acard .in { border-radius: 12px; background: linear-gradient(180deg, #1c254a, #121935); overflow: hidden; height: 100%; display: flex; flex-direction: column; }
.acard .pt { position: relative; aspect-ratio: 1 / 0.86; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--rc) 45%, transparent), transparent 70%), linear-gradient(180deg, #232d5c, #141a37); }
.acard .pt svg { position: absolute; inset: 6% 6% 0; width: 88%; height: 94%; }
.acard .ovr { position: absolute; left: 5px; top: 4px; font-family: var(--display); font-size: 22px; line-height: 0.9; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
.acard .ovr small { display: block; font-family: var(--cond); font-size: 10px; font-weight: 800; color: var(--rc); }
.acard .lv { position: absolute; right: 5px; top: 5px; font-family: var(--cond); font-weight: 800; font-size: 11px; background: rgba(0, 0, 0, 0.55); border-radius: 6px; padding: 1px 5px; }
.acard .stars { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; color: var(--gold); font-size: 10px; letter-spacing: 1px; text-shadow: 0 1px 2px #000; }
.acard .nm { padding: 5px 7px 6px; }
.acard .nm .n { font-family: var(--cond); font-weight: 800; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard .nm .p { font-size: 10.5px; color: var(--muted); font-family: var(--cond); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard.r4, .acard.r5 { background-size: 220% 220%; animation: shimmer 3.2s linear infinite; }
.acard.r5 { box-shadow: 0 0 16px -2px var(--r5); }
.acard.r4 { box-shadow: 0 0 12px -3px var(--r4); }
@keyframes shimmer { to { background-position: 220% 220%; } }
.acard .newtag { position: absolute; right: 4px; bottom: 4px; background: var(--bad); color: #fff; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 6px; font-family: var(--cond); letter-spacing: 0.5px; }
.acard.inlineup .in::after { content: "STARTER"; position: absolute; left: 50%; transform: translateX(-50%); top: 3px; font-size: 8.5px; font-weight: 800; font-family: var(--cond); letter-spacing: 1px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 0 0 6px 6px; }

.agrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.lineup { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }

/* ---------- Upgrade rows ---------- */
.urow { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: linear-gradient(180deg, var(--panel), #131a35); border: 1px solid var(--line); position: relative; overflow: hidden; }
.urow .uic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; background: linear-gradient(160deg, var(--panel3), var(--panel2)); font-size: 24px; }

.urow .ut { flex: 1; min-width: 0; }
.urow .ut .n { font-family: var(--cond); font-weight: 800; font-size: 15px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.urow .ut .n .lv { color: var(--gold); font-size: 12.5px; }
.urow .ut .d { font-size: 12px; color: var(--muted); margin-top: 1px; }

.flash-up { animation: flashUp 0.5s ease; }
@keyframes flashUp { 0% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.9); background: rgba(255, 210, 63, 0.25); } 100% { box-shadow: 0 0 0 14px rgba(255, 210, 63, 0); } }

/* ---------- Modals ---------- */
#modal-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.modal { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; pointer-events: auto; z-index: 1; isolation: isolate; }
.modal .scrim { position: absolute; inset: 0; background: rgba(3, 5, 14, 0.72); animation: fadeIn 0.2s ease; backdrop-filter: blur(2px); }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow-y: auto; overflow-x: hidden;
  background: linear-gradient(180deg, #1b2349, #10162f); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: sheetUp 0.28s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
}
.modal.center { align-items: center; padding: 16px; }
.modal.center .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); max-height: calc(100% - 32px); animation: popIn 0.3s cubic-bezier(.2, 1.3, .4, 1); padding: 18px; }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes popIn { from { transform: scale(0.8); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sheet-head .h2 { flex: 1; }
.close-x { width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 255, 255, 0.07); display: grid; place-items: center; font-size: 18px; flex: none; }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.2); margin: -6px auto 10px; }

/* ---------- Toasts ---------- */
#toast-root { position: fixed; left: 0; right: 0; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; max-width: 420px; display: flex; align-items: center; gap: 8px; background: rgba(20, 26, 54, 0.96); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow); animation: toastIn 0.3s cubic-bezier(.2, 1.3, .4, 1); }
.toast.out { animation: toastOut 0.25s ease forwards; }
.toast .ti { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); flex: none; }
.toast.good .ti { background: var(--good); } .toast.gold .ti { background: var(--gold); color: #3d2a00; } .toast.bad .ti { background: var(--bad); }
@keyframes toastIn { from { transform: translateY(-20px) scale(0.9); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-14px); opacity: 0; } }

/* ---------- FX layer ---------- */
#fx-root { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }

.fly.cash { background: var(--good); color: #063; box-shadow: 0 0 10px var(--good); }

.fly.tix { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.floatnum { position: absolute; font-family: var(--display); font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); animation: floatUp 0.9s ease forwards; white-space: nowrap; transform: translateX(-50%); }
@keyframes floatUp { to { transform: translate(-50%, -48px); opacity: 0; } }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; }

/* ---------- Coach / tutorial ---------- */
#coach-root { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.coach { position: absolute; left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; animation: popIn 0.35s cubic-bezier(.2, 1.3, .4, 1); max-width: 520px; margin: 0 auto; }
.coach .face { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex: none; background: radial-gradient(circle at 50% 35%, #3a4a8c, #1b2349); border: 3px solid var(--gold); box-shadow: var(--shadow); }
.coach .bubble { flex: 1; background: #fff; color: #141a33; border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: 13.5px; box-shadow: var(--shadow); }

.spot { position: absolute; border-radius: 14px; box-shadow: 0 0 0 4px var(--gold), 0 0 0 9999px rgba(3, 5, 14, 0.55); pointer-events: none; transition: all 0.25s ease; animation: spotPulse 1.2s ease-in-out infinite; }
@keyframes spotPulse { 50% { box-shadow: 0 0 0 7px var(--gold), 0 0 0 9999px rgba(3, 5, 14, 0.55); } }
.finger { position: absolute; font-size: 30px; pointer-events: none; animation: tap 0.9s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
@keyframes tap { 50% { transform: translate(-4px, -8px); } }

/* ---------- Recruit ---------- */
.banner-card { position: relative; border-radius: 18px; overflow: hidden; padding: 16px; min-height: 170px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; isolation: isolate; }
.banner-card::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0.9; }
.banner-card.street::before { background: radial-gradient(circle at 85% 20%, rgba(255, 122, 47, 0.55), transparent 55%), linear-gradient(135deg, #2a1b3d, #141a37); }

.banner-card .bt { font-family: var(--display); font-size: 30px; letter-spacing: 1px; line-height: 0.95; max-width: 60%; }
.banner-card .bd { font-size: 12.5px; color: #dfe4ff; max-width: 58%; }
.odds-mini { display: flex; gap: 4px; flex-wrap: wrap; max-width: 62%; }
.odds-mini span { font-family: var(--cond); font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.35); }
.pity { font-family: var(--cond); font-size: 12px; color: #e8ebff; }
.pull-row { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; max-width: 64%; flex-wrap: wrap; }
.reveal-stage { position: relative; min-height: 360px; display: grid; place-items: center; }
.reveal-card { width: 180px; perspective: 900px; }
.reveal-card .flip { position: relative; width: 100%; aspect-ratio: 0.72; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.3, 1.4, .5, 1); }
.reveal-card.open .flip { transform: rotateY(180deg); }
.reveal-card .face-b, .reveal-card .face-f { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; }
.reveal-card .face-f { transform: rotateY(180deg); }
.reveal-card .face-b { background: radial-gradient(circle at 50% 40%, var(--rc), #10162f 70%); border: 3px solid var(--rc); display: grid; place-items: center; box-shadow: 0 0 40px -4px var(--rc); }
.reveal-card .face-b .ballart { width: 70%; animation: spinb 2s linear infinite; }
@keyframes spinb { to { transform: rotate(360deg); } }
.reveal-card.shake .flip { animation: shake 0.12s linear infinite; }
@keyframes shake { 25% { transform: translate(2px, -1px) rotate(1deg); } 75% { transform: translate(-2px, 1px) rotate(-1deg); } }
.beams { position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0 10deg, var(--rc) 12deg, transparent 16deg 40deg, var(--rc) 44deg, transparent 48deg 80deg, var(--rc) 84deg, transparent 88deg 130deg, var(--rc) 134deg, transparent 138deg 180deg, var(--rc) 184deg, transparent 188deg 240deg, var(--rc) 244deg, transparent 248deg 300deg, var(--rc) 304deg, transparent 308deg); opacity: 0.35; animation: spinb 9s linear infinite; pointer-events: none; mask-image: radial-gradient(circle, #000 20%, transparent 65%); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 65%); }
.rar-name { font-family: var(--display); font-size: 34px; letter-spacing: 3px; color: var(--rc); text-shadow: 0 0 18px var(--rc); text-align: center; }
.multi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.multi-grid .reveal-card { width: 100%; }

/* ---------- Gear ---------- */
.gicon { position: relative; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rc) 40%, transparent), rgba(0, 0, 0, 0.2)), var(--panel2); border: 2px solid var(--rc); flex: none; }

.gicon .glv { position: absolute; bottom: -5px; right: -5px; background: #0b0f1f; border: 1px solid var(--rc); border-radius: 6px; font-size: 9.5px; font-weight: 800; padding: 0 4px; font-family: var(--cond); }
.gicon.empty { border-style: dashed; border-color: var(--line); background: rgba(255, 255, 255, 0.03); }
.gicon.empty svg { color: var(--dim); }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; }

/* ---------- Attribute bars ---------- */
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.attr { display: grid; grid-template-columns: 34px 1fr 26px 26px; align-items: center; gap: 5px; font-family: var(--cond); font-weight: 700; font-size: 12px; }

.attr .v { text-align: right; font-variant-numeric: tabular-nums; }

.attr .tr:disabled { opacity: 0.3; }

/* ---------- Detail hero ---------- */
.hero { position: relative; display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: center; }
.hero .port { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1; border: 2px solid var(--rc); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--rc) 50%, transparent), #141a37 70%); }
.hero .port svg { position: absolute; inset: 4% 4% 0; width: 92%; height: 96%; }
.big-ovr { font-family: var(--display); font-size: 44px; line-height: 0.85; }
.power-num { font-family: var(--display); font-size: 28px; color: var(--gold); line-height: 1; }

/* ---------- Map ---------- */
.wmap { display: flex; flex-direction: column-reverse; gap: 10px; }
.wnode { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(90deg, color-mix(in srgb, var(--wc) 22%, transparent), rgba(255, 255, 255, 0.02)); position: relative; }
.wnode .wn { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 22px; background: var(--wc); color: #0b0f1f; box-shadow: 0 0 16px -2px var(--wc); }
.wnode.locked { filter: grayscale(1); opacity: 0.45; }
.wnode.current { border-color: var(--wc); box-shadow: 0 0 0 1px var(--wc), 0 0 22px -6px var(--wc); }

/* ---------- Lists ---------- */
.mission { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
.mission .mt { flex: 1; min-width: 0; }
.mission .mt .n { font-weight: 600; font-size: 13.5px; }
.mission .mt .bar { margin-top: 5px; }
.mission.done { opacity: 0.5; }
.rew { display: inline-flex; align-items: center; gap: 3px; font-family: var(--cond); font-weight: 800; font-size: 12.5px; }
.rew .ico { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; }
.rew.cash .ico { background: var(--good); color: #063; } .rew.gems .ico { background: var(--gem); } .rew.tickets .ico, .rew.eventTickets .ico { background: var(--gold); color: #5a3d00; }
.rew.tp .ico { background: var(--info); } .rew.scrap .ico { background: #8a94a8; } .rew.passXp .ico { background: var(--accent); } .rew.gear .ico { background: #c9a227; } .rew.shards .ico { background: #ff8fd0; }
.login-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lday { border-radius: 14px; padding: 8px 4px; text-align: center; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; min-height: 92px; justify-content: center; }
.lday.today { border-color: var(--gold); background: rgba(255, 210, 63, 0.1); box-shadow: 0 0 18px -6px var(--gold); }
.lday.claimed { opacity: 0.45; }
.lday.big { grid-column: span 2; }
.pass-row { display: grid; grid-template-columns: 36px 1fr 1fr; gap: 6px; align-items: stretch; }
.pass-cell { border-radius: 10px; padding: 6px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 44px; }
.pass-cell.prem { background: rgba(255, 210, 63, 0.06); border-color: rgba(255, 210, 63, 0.25); }
.pass-cell.locked { opacity: 0.45; }
.pass-tier { display: grid; place-items: center; font-family: var(--display); font-size: 20px; border-radius: 10px; background: var(--panel2); }
.pass-tier.reached { background: var(--accent); }
.lb-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); }
.lb-row.me { background: rgba(255, 122, 47, 0.18); border: 1px solid rgba(255, 122, 47, 0.5); }
.lb-row .rk { font-family: var(--display); font-size: 20px; text-align: center; }
.lb-row .rk.top { color: var(--gold); }
.contest-canvas { width: 100%; aspect-ratio: 1 / 0.95; border-radius: 16px; display: block; background: #000; touch-action: none; }
.meter { position: relative; height: 28px; border-radius: 14px; background: rgba(255, 255, 255, 0.08); overflow: hidden; border: 1px solid var(--line); }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(56, 217, 150, 0.5); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
.meter .zone.perfect { background: rgba(255, 210, 63, 0.75); border-color: var(--gold); }
.meter .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; border-radius: 2px; background: #fff; box-shadow: 0 0 8px #fff; }
.trophy-hero { text-align: center; padding: 8px 0 4px; }
.trophy-hero svg { width: 120px; height: 120px; filter: drop-shadow(0 0 24px rgba(255, 210, 63, 0.7)); animation: float 2.4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.offer { position: relative; border-radius: 16px; padding: 12px; border: 1px solid var(--line); background: linear-gradient(135deg, var(--panel2), var(--panel)); display: flex; gap: 10px; align-items: center; }
.offer.feature { background: linear-gradient(135deg, #4a2a10, #2a1640 60%, #1b2349); border-color: rgba(255, 210, 63, 0.4); }
.offer .oico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; flex: none; background: rgba(0, 0, 0, 0.25); }
.offer .oico svg { width: 30px; height: 30px; }
.offer .tag { position: absolute; top: -8px; right: 10px; background: var(--bad); color: #fff; font-family: var(--cond); font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 8px; letter-spacing: 0.5px; }
.price-note { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 2px; }
.cos-swatch { width: 100%; aspect-ratio: 1.6; border-radius: 10px; position: relative; overflow: hidden; border: 2px solid var(--line); }
.cos-swatch.sel { border-color: var(--gold); box-shadow: 0 0 14px -3px var(--gold); }
.toggle { position: relative; width: 48px; height: 28px; border-radius: 14px; background: rgba(255, 255, 255, 0.15); flex: none; transition: background 0.2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.toggle.on { background: var(--good); }
.toggle.on::after { transform: translateX(20px); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.textin { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); color: var(--fg); font-size: 16px; user-select: text; -webkit-user-select: text; }
textarea.textin { min-height: 90px; font-family: ui-monospace, monospace; font-size: 11px; resize: vertical; }
.splash { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2a1b4d, #0a0e1d 70%); }
.splash .logo { text-align: center; }
.splash .logo .t1 { font-family: var(--display); font-size: 64px; letter-spacing: 3px; line-height: 0.85; background: linear-gradient(180deg, #ffd23f, #ff7a2f 60%, #c9481a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.5)); }
.splash .logo .t2 { font-family: var(--display); font-size: 40px; letter-spacing: 12px; color: #fff; margin-top: 2px; }
.splash .logo .ballart { width: 110px; margin: 0 auto 10px; animation: bounceBall 0.9s cubic-bezier(.5, 0, .5, 1) infinite alternate; }
@keyframes bounceBall { to { transform: translateY(-26px); } }
.loading-dots::after { content: "..."; animation: dots 1s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }

@media (max-height: 700px) {
  #arena { gap: 4px; padding-top: 4px; }
  #arena .court-wrap { height: clamp(165px, 29vh, 240px); }
  .stagebar .wsub { display: none; }
  .abil { min-height: 42px; }
  .hub-btn { width: 52px; padding: 4px 0 3px; }
  .hub-btn svg { width: 19px; height: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }

/* ---------- Layout fixes ---------- */
.btn { padding-left: 12px; padding-right: 12px; white-space: normal; text-align: center; line-height: 1.1; }
.banner-card > :not(.bart) { position: relative; z-index: 1; }
.banner-card .pity, .banner-card .odds-mini { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
/* STARTER tag: an in-flow strip at the bottom of the card, so it never covers the rating, level or stars */
.acard.inlineup .in::after { position: static; transform: none; display: block; margin-top: auto; padding: 2px 0 1px; text-align: center; font-size: 10px; letter-spacing: 1px; line-height: 1.2; border-radius: 0; }
/* narrow cards (5-wide starters row): shrink the rating and level badges so they do not collide */
.acard { container-type: inline-size; }
@container (max-width: 84px) {
  .acard .ovr { font-size: 16px; left: 3px; top: 3px; }
  .acard .ovr small { font-size: 9px; }
  .acard .lv { font-size: 9px; padding: 0 3px; right: 3px; top: 3px; }
}

/* ---------- Home: Team Growth ---------- */
.mults { display: inline-flex; gap: 4px; }
.mults .chip { cursor: pointer; padding: 3px 9px; }
.mults .chip.on { background: rgba(255, 122, 47, 0.22); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(255, 122, 47, 0.5); }
.grow-head { display: flex; align-items: baseline; gap: 8px; margin: -2px 2px 8px; }
.grow-head .power-num { font-size: 22px; }
.grow-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 8px; border-radius: 14px; background: linear-gradient(180deg, var(--panel), #131a35); border: 1px solid var(--line); }
.grow-row .gic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, 0.05); }
.grow-row .gic svg { width: 22px; height: 22px; }
.grow-row .gt { flex: 1; min-width: 0; }
.grow-row .gt .n { font-family: var(--cond); font-weight: 800; font-size: 14.5px; display: flex; gap: 6px; align-items: baseline; }
.grow-row .gt .n .lv { color: var(--gold); font-size: 12px; }
.grow-row .gt .e { font-size: 11.5px; color: var(--good); font-family: var(--cond); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow-row .btn { min-width: 84px; min-height: 40px; }
.grow-row .btn.ghost .sub { color: var(--muted); }

/* ---------- Franchise Story bar ---------- */
.quest { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: 12px; background: linear-gradient(90deg, rgba(255, 210, 63, 0.16), rgba(255, 122, 47, 0.05)); border: 1px solid rgba(255, 210, 63, 0.35); width: 100%; }
.quest .qi { width: 28px; height: 28px; border-radius: 8px; background: var(--gold); color: #3d2a00; display: grid; place-items: center; flex: none; }

.quest .qt { flex: 1; min-width: 0; }

.quest .qn { font-family: var(--cond); font-weight: 800; font-size: 13.5px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quest .qm { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; }

/* js/util.js */
/* Basketball Empire — core utilities (no DOM dependencies, runs in node for tests) */
(function (root) {
  'use strict';
  const BE = (root.BE = root.BE || {});

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc', 'SxDc', 'SpDc', 'OcDc', 'NoDc', 'Vg'];

  function fmt(n, digits) {
    if (n === undefined || n === null || !isFinite(n)) return '0';
    const neg = n < 0;
    n = Math.abs(n);
    let out;
    if (n < 1000) {
      out = n < 10 && n % 1 !== 0 ? n.toFixed(1).replace(/\.0$/, '') : Math.floor(n).toString();
    } else {
      const tier = Math.floor(Math.log10(n) / 3);
      if (tier < SUFFIX.length) {
        const scaled = n / Math.pow(1000, tier);
        const d = digits !== undefined ? digits : scaled < 10 ? 2 : scaled < 100 ? 1 : 0;
        out = scaled.toFixed(d).replace(/\.?0+$/, '') + SUFFIX[tier];
      } else {
        out = n.toExponential(2).replace('+', '');
      }
    }
    return (neg ? '-' : '') + out;
  }

  function fmtInt(n) {
    if (!isFinite(n)) return '0';
    return Math.floor(n).toLocaleString('en-US');
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (d > 0) return d + 'd ' + h + 'h';
    if (h > 0) return h + 'h ' + m + 'm';
    if (m > 0) return m + 'm ' + s + 's';
    return s + 's';
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function dayKey(t) {
    const d = new Date(t === undefined ? Date.now() : t);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function monthKey(t) {
    const d = new Date(t === undefined ? Date.now() : t);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  // ISO week key (weeks start Monday)
  function weekKey(t) {
    const d = new Date(t === undefined ? Date.now() : t);
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const wk = Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
    return date.getUTCFullYear() + '-W' + pad2(wk);
  }
  function msUntilNextDay(t) {
    const d = new Date(t === undefined ? Date.now() : t);
    const n = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    return n - d;
  }
  function msUntilNextWeek(t) {
    const d = new Date(t === undefined ? Date.now() : t);
    const day = d.getDay() || 7; // Mon=1..Sun=7
    const n = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (8 - day));
    return n - d;
  }
  function msUntilNextMonth(t) {
    const d = new Date(t === undefined ? Date.now() : t);
    const n = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return n - d;
  }
  function isWeekend(t) {
    const day = new Date(t === undefined ? Date.now() : t).getDay();
    return day === 0 || day === 6;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pick(arr, r) {
    if (typeof r === 'function') r = r();
    return arr[Math.floor((r === undefined ? Math.random() : r) * arr.length) % arr.length];
  }
  function weightedIndex(weights, r) {
    let total = 0;
    for (const w of weights) total += w;
    if (typeof r === 'function') r = r();
    let x = (r === undefined ? Math.random() : r) * total;
    for (let i = 0; i < weights.length; i++) {
      x -= weights[i];
      if (x < 0) return i;
    }
    return weights.length - 1;
  }
  let uidCounter = 0;
  function uid(prefix) {
    uidCounter = (uidCounter + 1) % 1e6;
    return (prefix || '') + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36) + uidCounter.toString(36);
  }
  function num(v, def) { return typeof v === 'number' && isFinite(v) ? v : def; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

  // Tiny event bus
  const handlers = {};
  const bus = {
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); return () => bus.off(ev, fn); },
    off(ev, fn) { if (handlers[ev]) handlers[ev] = handlers[ev].filter((f) => f !== fn); },
    emit(ev, data) {
      const list = handlers[ev];
      if (!list) return;
      for (const fn of list.slice()) {
        try { fn(data); } catch (e) { console.error('[bus]', ev, e); }
      }
    },
  };

  BE.util = {
    mulberry32, hashStr, fmt, fmtInt, fmtTime, dayKey, weekKey, monthKey, msUntilNextDay, msUntilNextWeek,
    msUntilNextMonth, isWeekend, clamp, lerp, pick, weightedIndex, uid, num, esc, easeOutCubic, easeInOut, easeOutBack,
  };
  BE.bus = bus;
})(typeof window !== 'undefined' ? window : globalThis);

  'use strict';
  const BE = (root.BE = root.BE || {});
  const U = BE.util, D = BE.data;

  const RULES = {
    '1v1': { target: 7, two: 1, three: 2, k: 0.8, featuredEvery: 1, label: 'First to 7' },
    '3v3': { target: 11, two: 1, three: 2, k: 0.68, featuredEvery: 1, label: 'First to 11' },
    '5v5': { quarters: 4, perQuarter: 12, two: 2, three: 3, k: 0.46, featuredEvery: 4, label: '4 quarters' },
  };

  // team: {name, colors, players:[{name,short,number,pos,attrs,look,arch,personality,celebration,power}], power, style:{off,def}, tactic:{off,def}, isPlayer}
  function createMatch(home, away, opts) {
    opts = opts || {};
    const fmt = opts.format || '5v5';
    const rules = RULES[fmt];
    const m = {
      format: fmt, rules, teams: [home, away],
      score: [0, 0], poss: 0, offense: opts.awayFirst ? 1 : 0, quarter: 1, qPoss: 0,
      over: false, winner: -1, overtime: false,
      stamina: [home.players.map(() => 100), away.players.map(() => 100)],
      fx: [{ hype: 0, lockdown: 0, iso: false }, { hype: 0, lockdown: 0, iso: false }],
      energy: opts.energy || 0,
      bonus: opts.bonus || { shoot: 0, def: 0, reb: 0, tactic: 0.12, staminaDrain: 1 },
      stats: [home.players.map(blankStats), away.players.map(blankStats)],
      teamStats: [blankTeamStats(), blankTeamStats()],
      rng: opts.rng || Math.random,
      lastEvent: null,
      maxPoss: fmt === '5v5' ? 200 : 90,
    };
    return m;
  }
  function blankStats() { return { pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, threes: 0, dunks: 0 }; }
  function blankTeamStats() { return { threes: 0, dunks: 0, blocks: 0, steals: 0 }; }

  function attr(p, k) { return (p.attrs[k] || 40); }

  function tacticMult(m, ti) {
    // offense of team ti vs defense of other
    const me = m.teams[ti], them = m.teams[1 - ti];
    let off = 1, def = 1;
    const bonus = ti === 0 ? m.bonus.tactic : 0.12;
    if (me.tactic && them.tactic) {
      if (D.offCounters[me.tactic.off] === them.tactic.def) off += bonus;
      if (D.offCounters[them.tactic.off] === me.tactic.def) off -= bonus * 0.5; // their offense counters our D
      if (D.defCounters[me.tactic.def] === them.tactic.off) def += bonus;
    }
    return { off, def };
  }

  function teamEff(m, ti, offense) {
    const t = m.teams[ti];
    const sta = m.stamina[ti];
    let avg = 0;
    for (const v of sta) avg += v;
    avg /= sta.length;
    let eff = t.power * (0.88 + 0.12 * avg / 100);
    const fx = m.fx[ti];
    if (fx.hype > 0) eff *= 1.3;
    if (!offense && fx.lockdown > 0) eff *= 1.35;
    const tm = tacticMult(m, ti);
    eff *= offense ? tm.off : tm.def;
    if (m.score[ti] < m.score[1 - ti] && t.players.some((p) => p.personality === 'underdog')) eff *= 1.08;
    if (ti === 0) eff *= offense ? 1 + m.bonus.shoot : 1 + m.bonus.def;
    return eff;
  }

  function wpick(arr, wfn, rng) {
    const w = arr.map(wfn);
    return arr[U.weightedIndex(w, rng())];
  }

  function isClutch(m) {
    if (m.format === '5v5') return m.quarter >= 4 && m.qPoss >= m.rules.perQuarter * 2 - 6 && Math.abs(m.score[0] - m.score[1]) <= 6;
    const t = m.rules.target;
    return Math.max(m.score[0], m.score[1]) >= t - 3 && Math.abs(m.score[0] - m.score[1]) <= 2;
  }

  // Resolve one possession; returns event {off, segs:[...], pts, featured, clutch}
  function nextPossession(m) {
    if (m.over) return null;
    const rng = m.rng;
    const o = m.offense, d = 1 - o;
    const O = m.teams[o], Dt = m.teams[d];
    const rules = m.rules;
    const ratio = teamEff(m, o, true) / Math.max(1e-9, teamEff(m, d, false));
    const f = U.clamp(Math.pow(ratio, rules.k), 0.25, 4);
    const segs = [];
    const ev = { off: o, segs, pts: 0, clutch: isClutch(m) };
    const oPl = O.players, dPl = Dt.players;
    const guard = (i) => Math.min(i, dPl.length - 1);
    const tac = O.tactic ? O.tactic.off : 'balanced';
    const dtac = Dt.tactic ? Dt.tactic.def : 'man';

    // handler & passes
    let hIdx = oPl.indexOf(wpick(oPl, (p) => attr(p, 'hnd') + attr(p, 'pas') + attr(p, 'iq') * 0.5, rng));
    segs.push({ t: 'dribble', team: o, who: hIdx });
    const iso = m.fx[o].iso;
    let assister = -1;
    let shooter = hIdx;
    if (oPl.length > 1) {
      const nPass = iso ? 1 : U.weightedIndex(tac === 'balanced' ? [1, 3, 3] : [2, 3, 1], rng());
      let cur = hIdx;
      for (let i = 0; i < nPass; i++) {
        let to;
        if (iso && i === nPass - 1) to = bestScorer(oPl);
        else {
          const others = oPl.map((_, k) => k).filter((k) => k !== cur);
          to = wpick(others, (k) => attr(oPl[k], 'sht') + attr(oPl[k], 'thr') * 0.6 + attr(oPl[k], 'str') * 0.4, rng);
        }
        if (to === cur) continue;
        // steal on pass
        const def = dPl[guard(to)];
        const stealP = 0.035 * Math.pow(attr(def, 'stl') / Math.max(20, attr(oPl[cur], 'pas')), 0.7) / Math.sqrt(f) * (dtac === 'press' ? 1.5 : 1) * (def.arch === 'clamps' || def.arch === 'lockdown' ? 1.15 : 1);
        if (rng() < stealP) {
          segs.push({ t: 'pass', team: o, from: cur, to, stolen: true });
          segs.push({ t: 'steal', team: d, who: guard(to), from: cur });
          m.stats[d][guard(to)].stl++; m.teamStats[d].steals++;
          return finish(m, ev);
        }
        segs.push({ t: 'pass', team: o, from: cur, to });
        assister = cur;
        cur = to;
      }
      shooter = cur;
    }
    if (iso) m.fx[o].iso = false;
    const sp = oPl[shooter];
    const dIdx = guard(shooter);
    const dp = dPl[dIdx];

    // on-ball steal
    const tovP = 0.06 * Math.pow(attr(dp, 'stl') / Math.max(20, attr(sp, 'hnd')), 0.7) / Math.sqrt(f) * (dtac === 'press' ? 1.4 : 1) * (dp.arch === 'lockdown' ? 1.15 : 1);
    if (rng() < tovP) {
      segs.push({ t: 'steal', team: d, who: dIdx, from: shooter });
      m.stats[d][dIdx].stl++; m.teamStats[d].steals++;
      return finish(m, ev);
    }

    // choose action
    const tw = { inside: [0.6, 0.8, 1.5, 1.4], balanced: [1, 1, 1, 1], outside: [1.7, 1.1, 0.7, 0.5] }[tac];
    const big = sp.pos === 'C' || sp.pos === 'PF';
    const wts = [
      Math.pow(attr(sp, 'thr'), 2) * tw[0] * (big ? 0.35 : 1),
      Math.pow(attr(sp, 'sht'), 2) * 0.7 * tw[1],
      Math.pow((attr(sp, 'spd') + attr(sp, 'hnd')) / 2, 2) * tw[2],
      Math.pow(attr(sp, 'str'), 2) * tw[3] * (big ? 1 : 0.25),
    ];
    const act = ['three', 'mid', 'drive', 'post'][U.weightedIndex(wts, rng())];
    let kind = act;
    if (act === 'drive') {
      const dunkP = U.clamp((attr(sp, 'spd') + attr(sp, 'str') - 90) / 120, 0.08, 0.75) * (sp.arch === 'slasher' ? 1.5 : 1) * Math.min(1.4, Math.sqrt(f));
      kind = rng() < dunkP ? 'dunk' : 'layup';
      segs.push({ t: 'drive', team: o, who: shooter });
    } else if (act === 'post') segs.push({ t: 'post', team: o, who: shooter });

    const res = shoot(m, o, shooter, dIdx, kind, f, assister, ev);
    if (res === 'miss') rebound(m, o, f, ev, 0);
    return finish(m, ev);
  }

  function bestScorer(pl) {
    let best = 0, bv = -1;
    pl.forEach((p, i) => { const v = attr(p, 'sht') + attr(p, 'thr') + attr(p, 'spd') * 0.5; if (v > bv) { bv = v; best = i; } });
    return best;
  }

  function shoot(m, o, si, di, kind, f, assister, ev) {
    const rng = m.rng, d = 1 - o;
    const sp = m.teams[o].players[si], dp = m.teams[d].players[di];
    const rules = m.rules;
    const segs = ev.segs;
    const base = { three: 0.35, mid: 0.43, layup: 0.53, dunk: 0.72, post: 0.47, putback: 0.52 }[kind];
    const keyA = { three: 'thr', mid: 'sht', layup: 'spd', dunk: 'str', post: 'str', putback: 'reb' }[kind];
    const keyD = kind === 'three' || kind === 'mid' ? 'def' : kind === 'post' || kind === 'putback' ? 'str' : 'def';
    let p = base * Math.pow(attr(sp, keyA) / Math.max(20, attr(dp, keyD)), 0.35) * Math.pow(f, 0.6);
    if (kind === 'three' && sp.arch === 'sharpshooter') p *= 1.12;
    if ((kind === 'layup' || kind === 'dunk') && sp.arch === 'slasher') p *= 1.1;
    if (kind === 'post' && sp.arch === 'post') p *= 1.12;
    if (assister >= 0 && m.teams[o].players[assister].arch === 'general') p *= 1.08;
    if (sp.arch === 'twoway') p *= 1.05;
    if (ev.clutch && sp.personality === 'assassin') p *= 1.1;
    if (m.fx[o].isoBoost) { p *= 1.4; m.fx[o].isoBoost = false; }
    p = U.clamp(p, 0.06, 0.95);
    // stamina drain
    drain(m, o, si);
    // block
    if (kind !== 'three' && kind !== 'mid') {
      let bp = 0.075 * Math.pow(attr(dp, 'blk') / Math.max(20, attr(sp, kind === 'dunk' || kind === 'post' ? 'str' : 'hnd')), 0.8) / Math.pow(f, 0.4);
      if (dp.arch === 'rim') bp *= 1.4;
      if (rng() < U.clamp(bp, 0.01, 0.35)) {
        segs.push({ t: 'shot', team: o, who: si, kind, made: false, blockedBy: di, pts: 0 });
        m.stats[d][di].blk++; m.teamStats[d].blocks++;
        return 'miss';
      }
    } else if (kind === 'three' && rng() < 0.02 / Math.pow(f, 0.4)) {
      segs.push({ t: 'shot', team: o, who: si, kind, made: false, blockedBy: di, pts: 0 });
      m.stats[d][di].blk++; m.teamStats[d].blocks++;
      return 'miss';
    }
    // foul on drives
    if ((kind === 'layup' || kind === 'dunk' || kind === 'post') && rng() < 0.09) {
      segs.push({ t: 'foul', team: d, who: di, on: si });
      const ftP = U.clamp(0.48 + attr(sp, 'sht') / 260, 0.4, 0.93);
      const n = rules.two === 1 ? 1 : 2;
      let made = 0;
      const shots = [];
      for (let i = 0; i < n; i++) { const mk = rng() < ftP; shots.push(mk); if (mk) made++; }
      segs.push({ t: 'ft', team: o, who: si, shots });
      m.score[o] += made; ev.pts += made; m.stats[o][si].pts += made;
      return 'done';
    }
    const made = rng() < p;
    const pts = made ? (kind === 'three' ? rules.three : rules.two) : 0;
    segs.push({ t: 'shot', team: o, who: si, kind, made, pts, assist: made ? assister : -1 });
    if (made) {
      m.score[o] += pts; ev.pts += pts;
      m.stats[o][si].pts += pts;
      if (assister >= 0) m.stats[o][assister].ast++;
      if (kind === 'three') { m.stats[o][si].threes++; m.teamStats[o].threes++; }
      if (kind === 'dunk') { m.stats[o][si].dunks++; m.teamStats[o].dunks++; }
      return 'made';
    }
    return 'miss';
  }

  function rebound(m, o, f, ev, depth) {
    const rng = m.rng, d = 1 - o;
    const O = m.teams[o].players, Dp = m.teams[d].players;
    const bestO = wpick(O.map((_, i) => i), (i) => Math.pow(attr(O[i], 'reb'), 2) * (O[i].arch === 'glass' ? 1.3 : 1), rng);
    const bestD = wpick(Dp.map((_, i) => i), (i) => Math.pow(attr(Dp[i], 'reb'), 2) * (Dp[i].arch === 'glass' ? 1.3 : 1), rng);
    let orp = 0.26 * Math.pow(attr(O[bestO], 'reb') / Math.max(20, attr(Dp[bestD], 'reb')), 0.6) * Math.pow(f, 0.25);
    if (o === 0) orp *= 1 + m.bonus.reb; else orp /= 1 + m.bonus.reb;
    if (rng() < U.clamp(orp, 0.08, 0.6)) {
      ev.segs.push({ t: 'rebound', team: o, who: bestO, off: true });
      m.stats[o][bestO].reb++;
      if (depth < 1) {
        const res = shoot(m, o, bestO, Math.min(bestO, Dp.length - 1), 'putback', f, -1, ev);
        if (res === 'miss') rebound(m, o, f, ev, depth + 1);
      } else {
        ev.segs.push({ t: 'reset', team: o });
      }
    } else {
      ev.segs.push({ t: 'rebound', team: d, who: bestD, off: false });
      m.stats[d][bestD].reb++;
    }
  }

  function drain(m, ti, pi) {
    const p = m.teams[ti].players[pi];
    let k = (130 - attr(p, 'sta')) / 70 * (p.personality === 'workhorse' ? 0.7 : 1);
    if (ti === 0) k *= m.bonus.staminaDrain;
    const st = m.stamina[ti];
    for (let i = 0; i < st.length; i++) st[i] = Math.max(35, st[i] - k * (i === pi ? 1.4 : 0.5) * (m.format === '5v5' ? 0.55 : 1));
  }

  function finish(m, ev) {
    const o = ev.off;
    m.poss++;
    m.qPoss++;
    // effects tick (per possession for each team's own buffs)
    for (const fx of m.fx) {
      if (fx.hype > 0) fx.hype--;
    }
    if (m.fx[1 - o].lockdown > 0) m.fx[1 - o].lockdown--;
    // energy (player team = 0)
    let gain = 3;
    const last = ev.segs[ev.segs.length - 1];
    for (const s of ev.segs) {
      if (s.team === 0 && ((s.t === 'shot' && s.made && (s.kind === 'dunk' || s.kind === 'three')) || s.t === 'steal')) gain += 4;
      if (s.team === 1 && s.t === 'shot' && s.blockedBy !== undefined) gain += 4;
    }
    if (m.teams[0].players.some((p) => p.arch === 'showman')) gain += 1;
    m.energy = Math.min(100, m.energy + gain);
    ev.featured = m.format !== '5v5' || ev.clutch || m.qPoss % m.rules.featuredEvery === 0 || m.score[0] + m.score[1] < 3;
    // rotate possession (streetball: make-it-take-it disabled for fairness; alternate)
    m.offense = 1 - o;
    // end conditions
    const r = m.rules;
    if (m.format === '5v5') {
      const perQ = r.perQuarter * 2;
      const qLimit = m.overtime ? 6 : perQ;
      if (m.qPoss >= qLimit) {
        ev.endQuarter = m.quarter;
        if (m.quarter >= 4 && m.score[0] !== m.score[1]) end(m);
        else if (m.quarter >= 4) { m.overtime = true; m.quarter++; m.qPoss = 0; ev.overtime = true; }
        else { m.quarter++; m.qPoss = 0; }
        for (const st of m.stamina) for (let i = 0; i < st.length; i++) st[i] = Math.min(100, st[i] + 18);
      }
    } else {
      if (m.score[0] >= r.target || m.score[1] >= r.target) end(m);
    }
    if (!m.over && m.poss >= m.maxPoss) { if (m.score[0] === m.score[1]) m.score[m.rng() < 0.5 ? 0 : 1]++; end(m); }
    ev.score = m.score.slice();
    ev.last = last;
    m.lastEvent = ev;
    return ev;
  }
  function end(m) {
    m.over = true;
    m.winner = m.score[0] > m.score[1] ? 0 : 1;
  }

  // Abilities (player team = 0)
  function useAbility(m, k, costMult) {
    const ab = D.abilities.find((a) => a.k === k);
    if (!ab || m.over) return false;
    const cost = Math.round(ab.cost * (costMult || 1));
    if (m.energy < cost) return false;
    m.energy -= cost;
    const fx = m.fx[0];
    if (k === 'hype') fx.hype = 6;
    else if (k === 'iso') { fx.iso = true; fx.isoBoost = true; }
    else if (k === 'lockdown') fx.lockdown = 3;
    else if (k === 'timeout') { m.stamina[0] = m.stamina[0].map(() => 100); m.energy = Math.min(100, m.energy + 15); }
    return true;
  }

  function playAll(m) {
    let n = 0;
    while (!m.over && n < 500) { nextPossession(m); n++; }
    return m;
  }

  function mvp(m, ti) {
    let best = 0, bv = -1;
    m.stats[ti].forEach((s, i) => { const v = s.pts + s.reb * 0.8 + s.ast * 1 + s.stl * 1.5 + s.blk * 1.5; if (v > bv) { bv = v; best = i; } });
    return best;
  }

  // Monte-Carlo win probability (headless) — used for offline simulation & UI hints
  function winProb(homeFactory, awayFactory, fmt, n, seed) {
    const rng = U.mulberry32(seed || 1234);
    let w = 0;
    for (let i = 0; i < n; i++) {
      const m = createMatch(homeFactory(), awayFactory(), { format: fmt, rng });
      playAll(m);
      if (m.winner === 0) w++;
    }
    return w / n;
  }

  BE.sim = { RULES, createMatch, nextPossession, useAbility, playAll, mvp, winProb };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/game.js */
/* Basketball Empire — game orchestration: opponents, match lifecycle, rewards, idle ticks, offline progress, resets */
(function (root) {
  'use strict';
  const BE = (root.BE = root.BE || {});
  const U = BE.util, D = BE.data, A = BE.athletes, E = BE.econ, S = BE.sim, B = D.balance;

  function cosmetic(s) { return D.cosmetics.find((c) => c.k === s.franchise.cosmetic) || D.cosmetics[0]; }

  function gearVis(s, a) {
    const v = {};
    for (const slot in a.gear) { const it = s.gearById[a.gear[slot]]; if (it) v[slot] = it.rarity; }
    return v;
  }

  // ---------- Lineup management ----------
  function ensureLineup(s, size) {
    size = size || E.sizeOf(Math.min(s.run.cleared, 99));
    const m = E.mods(s);
    s.lineup = s.lineup.filter((u) => s.rosterByUid[u]);
    if (s.lineup.length < size) {
      const free = s.roster.filter((a) => !s.lineup.includes(a.uid)).sort((a, b) => E.athletePower(s, b, m) - E.athletePower(s, a, m));
      while (s.lineup.length < size && free.length) s.lineup.push(free.shift().uid);
    }
  }
  function autoLineup(s) {
    const m = E.mods(s);
    const sorted = s.roster.slice().sort((a, b) => E.athletePower(s, b, m) - E.athletePower(s, a, m));
    s.lineup = sorted.slice(0, 5).map((a) => a.uid);
  }
  // A new athlete stronger than the weakest active starter takes their spot
  function autoPromote(s, a) {
    const size = E.sizeOf(Math.min(s.run.cleared, 99));
    if (s.lineup.slice(0, size).includes(a.uid)) return null;
    const m = E.mods(s);
    const pa = E.athletePower(s, a, m);
    let worst = -1, wv = Infinity;
    s.lineup.slice(0, size).forEach((u, i) => { const x = s.rosterByUid[u]; const p = x ? E.athletePower(s, x, m) : -1; if (p < wv) { wv = p; worst = i; } });
    if (worst < 0 || pa <= wv) return null;
    const out = s.rosterByUid[s.lineup[worst]];
    const old = s.lineup.indexOf(a.uid);
    if (old >= 0) s.lineup.splice(old, 1);
    s.lineup[worst] = a.uid;
    if (out && !s.lineup.includes(out.uid) && s.lineup.length < 5) s.lineup.push(out.uid);
    return out || null;
  }
  // When a format grows beyond the roster, local kids join for free
  function giftWalkOns(s, size) {
    const gifts = [];
    while (s.roster.length < size) {
      const pool = A.catalog.filter((t) => t.rarity <= 1 && t.world === 0 && !s.collection[t.id]);
      const t = pool.length ? pool[Math.floor(Math.random() * pool.length)] : A.catalog[0];
      const r = E.addAthlete(s, t);
      r.a.lvl = Math.max(1, Math.max.apply(null, s.roster.map((x) => x.lvl)));
      gifts.push(r.a);
    }
    ensureLineup(s, size);
    return gifts;
  }

  // ---------- Targets ----------
  function target(s) {
    const c = s.run.cleared;
    if (s.run.champ) return { g: s.run.champ.g, round: s.run.champ.round, mode: 'champ' };
    if (c >= 100) return { g: c, mode: s.run.farming ? 'farm' : 'push', farmG: c - 1 }; // endless rifts
    if (E.isChamp(c)) return { g: Math.max(0, c - 1), mode: 'farm', champReady: true };
    if (s.run.farming && c > 0) return { g: c - 1, mode: 'farm' };
    return { g: c, mode: 'push' };
  }

  function playerTeam(s, size) {
    ensureLineup(s, size);
    const m = E.mods(s);
    const ls = E.lineupAthletes(s).slice(0, size);
    const cos = cosmetic(s);
    const players = ls.map((a) => {
      const t = A.tpl(a.cid);
      return {
        uid: a.uid, name: A.displayName(t), short: t.last, number: t.number, pos: t.pos, attrs: A.effAttrs(s, a), look: t.look,
        arch: t.arch, personality: t.personality, celebration: t.celebration, rarity: t.rarity, power: E.athletePower(s, a, m), gear: gearVis(s, a),
      };
    });
    while (players.length < size) {
      const opp = A.opponentTeam(0, 1, { seed: players.length + 99 }).players[0];
      opp.name = 'Walk-on'; opp.short = 'Walk-on'; opp.power = E.oppPerPlayer(0) * 0.6; opp.gear = {};
      players.push(opp);
    }
    const power = E.teamPower(s, size) + players.slice(ls.length).reduce((t, p) => t + p.power, 0);
    return {
      name: s.franchise.name, colors: cos.jersey, players, power, isPlayer: true,
      tactic: { off: s.tactics.off, def: s.tactics.def },

  }

  function oppTeam(s, g, round) {
    const size = E.sizeOf(Math.min(g, 99));

    if (champ && round < 2) {

      const pool = D.worlds[w].teams.slice(0, 9);
      name = pool[(round * 4 + 3) % 9] + (size === 1 ? '' : ' (Playoff)');
    }
    const t = A.opponentTeam(g, size, { round: champ ? round + 1 : 0, name });
    const per = E.oppPerPlayer(g, champ ? round : undefined);
    t.players.forEach((p) => { p.power = per; p.short = p.last; p.name = p.first + ' ' + p.last; p.gear = {}; });
    t.power = per * size;

  }

  function autoTactics(s, opp) {

    const defFor = { outside: 'man', inside: 'zone', balanced: 'press' };

    s.tactics.def = defFor[opp.style.off];
  }

  function newMatch(s, opts) {

  // ---------- Results ----------

      if (tg.mode === 'push' && (g + 1) % 5 === 0 && g < 100) { r.tickets += 1; s.tickets += 1; }

  function startChampionship(s) {

  // ---------- Idle ticking ----------
  function tick(s, dt) {
    const m = E.mods(s);

      const div = inc * m.autoTrain;
      inc -= div;
      s.run.autoBudget = (s.run.autoBudget || 0) + div;
      autoTrainSpend(s);

    E.addCash(s, inc);
    s.division.earned += E.divisionPerSec(s) * dt;
    s.tp += E.tpPerSec(s) * dt;

    const ac = s.facilities.academy || 0;
    if (ac > 0) {

      const now = Date.now();
      if (!s.timers.academy || s.timers.academy > now) s.timers.academy = now;
      let n = 0;
      while (now - s.timers.academy >= interval && n < 10) { s.timers.academy += interval; s.tickets++; n++; }

        const c = E.levelCost(s, a, 1);
        if (c < cc) { cc = c; cheapest = a; }

      if (!cheapest || s.run.autoBudget < cc) break;
      s.run.autoBudget -= cc;
      cheapest.lvl++;
      s.stats.levelups++;

  }

  // ---------- Offline progress ----------
  function estimateWinProb(s, g, round) {
    const fmt = E.formatOf(Math.min(g, 99));
    const size = D.formats[fmt].size;
    const home = playerTeam(s, size);
    const away = oppTeam(s, g, round);
    const m = E.mods(s);
    const bonus = Object.assign({}, m.sim, { staminaDrain: m.staminaDrain });
    const rng = U.mulberry32(777 + g);
    let w = 0;
    const n = fmt === '5v5' ? 16 : 30;
    for (let i = 0; i < n; i++) {
      const mt = S.createMatch(home, away, { format: fmt, rng, bonus });
      S.playAll(mt);
      if (mt.winner === 0) w++;
    }
    return w / n;
  }

  function offline(s, seconds) {
    const m = E.mods(s);
    const capS = m.offlineCapH * 3600;
    const t = Math.min(seconds, capS);
    const eff = m.offlineEff;
    const res = { seconds, counted: t, capped: seconds > capS, games: 0, wins: 0, cash: 0, tp: 0, fans: 0, stages: 0, division: 0, eff };
    if (t < 60) return res;
    const gameLen = 28;
    let games = Math.floor(t / gameLen);

    let guard = 0;
    while (games > 0 && guard++ < 40 && !s.run.champ) {
      const c = s.run.cleared;
      if (E.isChamp(c) || c >= 300) break;
      const p = estimateWinProb(s, c);
      if (p < 0.55) break;
      const cost = Math.ceil(1 / p);
      if (games < cost) break;
      games -= cost;
      cash += E.stageReward(s, c);
      res.wins += 1;
      s.run.cleared = c + 1;
      s.run.farming = false;
      s.stats.stagesCleared++;
      res.stages++;
      res.fans += E.fansPerWin(s, c);
      if (s.run.cleared > s.best) s.best = s.run.cleared;

      const w = Math.floor(games * p);
      res.wins += w;
      cash += w * E.stageReward(s, fg) * B.farmReward + (games - w) * E.stageReward(s, fg) * B.lossReward;
      res.fans += w * E.fansPerWin(s, fg);
    }
    cash += E.passivePerSec(s) * t;
    res.division = E.divisionPerSec(s) * t * eff;
    res.cash = cash * eff + res.division;
    res.tp = E.tpPerSec(s) * t;
    res.fans *= eff;
    s.stats.wins += res.wins;
    s.stats.gamesPlayed += res.games;
    s.fans += res.fans;
    s.tp += res.tp;
    s.division.earned += res.division;
    E.addCash(s, res.cash);

  // ---------- Daily / weekly / monthly resets ----------
  function makeMissions(s, kind, key) {
    const pool = D.missionPool[kind].filter((m) => !m.feature || E.unlocked(s, m.feature));
    const rng = U.mulberry32(U.hashStr(key + kind + s.created));
    const picks = [];

    for (let i = 0; i < count && avail.length; i++) {

    }

  }

  // ---------- Franchise Story (quest chain) ----------
  function questProgress(s, q) {
    switch (q.stat) {

      case 'roster': return s.roster.length;
      case 'unique': return s.stats.unique;
      default: return s.stats[q.stat] || 0;
    }
  }
  function questState(s) {

    },
  };

  function runTournament(s) {

    s.tourney.entries++;
    const g = Math.max(0, s.run.cleared - 1);
    const fmt = E.formatOf(Math.min(g, 99));
    const size = D.formats[fmt].size;

    const m = E.mods(s);

  // ---------- Projection ----------
  function setupProjection() {

  function drawStands(g) {

  function quad(g, pts, fill) {
    g.beginPath(); g.moveTo(pts[0].x, pts[0].y);

    return pts;
  }

  function drawFloor(g) {
    const T = C.theme;
    const corners = [proj(-30, 0), proj(30, 0), proj(30, 49), proj(-30, 49)];
    quad(g, corners, T.floor);
    // planks / texture
    const rng = U.mulberry32(11 + C.world);
    if (T.stands === 'fence') {
      for (let i = 0; i < 500; i++) { const p = proj(rng() * 60 - 30, rng() * 49); g.fillStyle = rng() < 0.5 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.05)'; g.fillRect(p.x, p.y, 2 * p.s / 10, 1.5 * p.s / 10); }

    } else {

      gl.addColorStop(0, 'rgba(255,255,255,.14)'); gl.addColorStop(1, 'rgba(255,255,255,0)');

  function buildCrowd() {
    C.crowd = [];
    const T = C.theme;
    if (!T) return;
    const base = proj(0, 0, 0).y;
    const rng = U.mulberry32(500 + C.world);
    const density = T.crowd;
    if (T.stands === 'cosmic') return;
    const rows = T.stands === 'fence' ? 1 : T.stands === 'bleachers' ? 5 : 7;
    const shirts = ['#ff6a1f', '#2f6bff', '#ffd23f', '#e8263f', '#22c55e', '#ffffff', '#111111', '#b46bff', D.worlds[C.world].color];
    for (let r = 0; r < rows; r++) {
      const y = T.stands === 'fence' ? base - 14 : base * (0.3 + 0.62 * (r + 0.5) / rows);

  // ---------- Entities ----------
  function makePlayer(team, idx, info, colors) {
    return {
      team, idx, info, colors,
      x: 0, y: 30, z: 0, tx: 0, ty: 30, vz: 0, spd: 9,
      arms: 'idle', phase: Math.random() * 6, facing: team === 0 ? 'hoop' : 'hoop', jumpT: -1, jumpH: 0, jumpDur: 0.5,
      celebrate: null, slump: 0,

  }
  function startMatch(match) {

    C.tasks = [];
    C.floaters = [];
    C.banner = null;
    const size = match.teams[0].players.length;
    for (let t = 0; t < 2; t++) {
      const team = match.teams[t];
      team.players.forEach((p, i) => {
        const pl = makePlayer(t, i, p, team.colors);
        const f = FORM[size][i] || [0, 20];
        pl.x = pl.tx = (t ? -1 : 1) * f[0] * 0.6 + (t ? 3 : -3);
        pl.y = pl.ty = 25 + i * 1.5 + (t ? 3 : 0);

  // ---------- Task system ----------
  function task(dur, opts) { C.tasks.push(Object.assign({ dur, t: 0, started: false }, opts)); }
  function wait(dur) { task(dur, {}); }
  function call(fn) { task(0, { start: fn }); }

  function hand(p) {

      const k = p.arms === 'shoot' ? 'shoot' : p.arms === 'dunk' ? 'dunk' : p.arms === 'pass' ? 'pass' : 'idle';
      const hx = H[k][0] * (k === 'idle' || k === 'pass' ? dr : 1);
      return { x: p.x + hx * fpp, y: p.y - (k === 'shoot' || k === 'dunk' ? 0.2 : 0), z: p.z + H[k][1] * fpp };
    }
    const side = p.team === 0 ? 0.7 : -0.7;
    if (p.arms === 'shoot') return { x: p.x + 0.1, y: p.y - 0.2, z: p.z + 7.4 };
    if (p.arms === 'dunk') return { x: p.x, y: p.y - 0.3, z: p.z + 7.8 };

  function giveBall(p) {
    const b = C.ball;
    b.holder = p; b.flight = null;
  }

  function setupFormation(offTeam) {
    const size = C.match.teams[0].players.length;
    const def = 1 - offTeam;
    const rnd = () => (Math.random() * 2 - 1) * 1.8;
    for (const p of teamPlayers(offTeam)) {
      const f = FORM[size][p.idx];
      p.tx = f[0] + rnd(); p.ty = f[1] + rnd(); p.arms = 'idle'; p.facing = 'hoop'; p.celebrate = null; p.slump = 0;
    }
    for (const p of teamPlayers(def)) {
      const man = P(offTeam, Math.min(p.idx, size - 1));
      const zone = C.match.teams[def].tactic && C.match.teams[def].tactic.def === 'zone';
      const k = zone ? 0.45 : 0.3;

  function moveTo(p, x, y) { p.tx = x; p.ty = y; }
  function jump(p, h, dur) { p.jumpT = 0; p.jumpH = h; p.jumpDur = dur; }
  function ballArc(from, to, dur, peak, onLand) {

  }
  function floater(text, x, y, z, color, size) {

  }
  function burst(x, y, z, colors, n, power) {

      C.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.6 + Math.random() * 0.6, t: 0, c: U.pick(colors), r: 1.5 + Math.random() * 2.5, g: 380 });
    }
  }
  function confetti(n) {

    for (let i = 0; i < n; i++) {
      C.particles.push({ x: Math.random() * C.W, y: -10 - Math.random() * 60, vx: (Math.random() - 0.5) * 60, vy: 40 + Math.random() * 80, life: 2.5 + Math.random(), t: 0, c: U.pick(colors), r: 2 + Math.random() * 2.5, g: 30, conf: true, rot: Math.random() * 6 });
    }
  }

  // ---------- Possession playback ----------
  function playEvent(ev, done) {
    const m = C.match;
    const off = ev.off, def = 1 - off;
    C.tasks = [];
    const firstHandler = ev.segs[0] && ev.segs[0].t === 'dribble' ? P(off, ev.segs[0].who) : P(off, 0);
    call(() => { setupFormation(off); if (!C.ball.holder || C.ball.holder.team !== off) { const from = ballPos(); ballArc(from, () => hand(firstHandler), 0.35, 3, () => giveBall(firstHandler)); } });
    wait(0.5);
    for (const sg of ev.segs) queueSeg(sg, ev, off, def);

    call(() => { if (done) done(); });
  }

  function ballPos() { const b = C.ball; return { x: b.x, y: b.y, z: b.z }; }
  function rimPos() { return { x: HOOP.x + (Math.random() - 0.5) * 0.2, y: HOOP.y, z: HOOP.z + 0.2 }; }

  function queueSeg(sg, ev, off, def) {

      case 'pass': {
