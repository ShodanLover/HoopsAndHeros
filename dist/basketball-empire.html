            const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
            moveTo(d, mid.x, mid.y);
            ballArc(hand(from), () => ({ x: d.x, y: d.y, z: 3 }), 0.3, 1.2, () => giveBall(d));
          } else ballArc(hand(from), () => hand(to), 0.28, 1.2, () => { giveBall(to); to.arms = 'dribble'; });
          sfx('pass');
        });
        wait(0.34);
        break;
      }
      case 'steal': {
        const thief = P(sg.team, sg.who), victim = P(1 - sg.team, sg.from);
        call(() => {
          moveTo(thief, victim.x, victim.y + 0.8);
          if (C.ball.holder !== thief) ballArc(ballPos(), () => hand(thief), 0.2, 0.5, () => giveBall(thief));
          floater('STEAL!', thief.x, thief.y, 8, sg.team === 0 ? '#38d996' : '#ff5a5a', 1.1);
          sfx('steal'); excite(sg.team === 0 ? 0.6 : 0.2, sg.team === 0);
        });
        wait(0.3);
        call(() => { thief.arms = 'dribble'; moveTo(thief, thief.x * 0.5, 29); victim.slump = 1; });
        wait(0.45);
        break;
      }
      case 'drive': {
        call(() => { const side = me.x >= 0 ? 1 : -1; moveTo(me, side * (2 + Math.random() * 2), 8.5); me.arms = 'dribble'; const d = P(1 - sg.team, Math.min(sg.who, C.match.teams[1 - sg.team].players.length - 1)); moveTo(d, side * 1.5, 7.2); sfx('squeak'); });
        wait(0.45);
        break;
      }
      case 'post': {
        call(() => { const side = me.x >= 0 ? 1 : -1; moveTo(me, side * 4.5, 8.5); me.arms = 'dribble'; const d = P(1 - sg.team, Math.min(sg.who, C.match.teams[1 - sg.team].players.length - 1)); moveTo(d, side * 3.8, 7.2); });
        wait(0.5);
        break;
      }
      case 'shot': queueShot(sg, me); break;
      case 'rebound': {
        call(() => {
          const r = P(sg.team, sg.who);
          const land = { x: (Math.random() - 0.5) * 10, y: 7 + Math.random() * 6 };
          moveTo(r, land.x, land.y);
          ballArc(ballPos(), () => ({ x: land.x, y: land.y, z: 8.4 }), 0.45, 4, () => { giveBall(r); r.arms = 'idle'; });
          jump(r, 2.4, 0.5);
          if (sg.off) floater('OFF. BOARD', land.x, land.y, 10, '#ffd23f', 0.8);
        });
        wait(0.6);
        break;
      }
      case 'foul': {
        call(() => { sfx('whistle'); floater('FOUL', me.x, me.y, 8, '#ffd23f', 1); });
        wait(0.45);
        break;
      }
      case 'ft': {
        const sh = P(sg.team, sg.who);
        call(() => {
          moveTo(sh, 0, 19); giveBall(sh); sh.arms = 'idle';
          let k = 0;
          for (const p of C.players) { if (p === sh) continue; const sd = k % 2 ? 1 : -1; const rowY = 8 + Math.floor(k / 2) * 3.2; moveTo(p, sd * 9, rowY); p.arms = 'idle'; p.facing = 'hoop'; k++; }
        });
        wait(0.55);
        sg.shots.forEach((made, i) => {
          call(() => { sh.arms = 'shoot'; ballArc(hand(sh), () => rimPos(), 0.55, 5, () => resolveShot(made, 1, sg.team, sh, 'ft')); });
          wait(0.85);
          call(() => { sh.arms = 'idle'; if (i < sg.shots.length - 1) giveBall(sh); });
          wait(0.1);
        });
        break;
      }
      case 'reset': wait(0.2); break;
      default: break;
    }
  }

  function queueShot(sg, me) {
    const kind = sg.kind;
    const defTeam = 1 - sg.team;
    const blocker = sg.blockedBy !== undefined ? P(defTeam, sg.blockedBy) : null;
    if (kind === 'three' || kind === 'mid') {
      call(() => {
        if (kind === 'three') {
          const dist = Math.hypot(me.tx - HOOP.x, me.ty - HOOP.y);
          if (dist < 24.3) { const a = Math.atan2(me.ty - HOOP.y, me.tx - HOOP.x); moveTo(me, HOOP.x + Math.cos(a) * 24.5, Math.max(HOOP.y + 1, HOOP.y + Math.sin(a) * 24.5)); }
        } else {
          const a = Math.atan2(me.ty - HOOP.y, me.tx - HOOP.x); moveTo(me, HOOP.x + Math.cos(a) * 15, Math.max(HOOP.y + 1, HOOP.y + Math.sin(a) * 15));
        }
      });
      wait(0.3);
      call(() => { me.arms = 'shoot'; jump(me, 1.8, 0.55); if (blocker) { moveTo(blocker, me.x, me.y - 1.2); jump(blocker, 2.6, 0.55); blocker.arms = 'block'; } });
      wait(0.22);
      if (blocker) {
        call(() => blockBall(me, blocker, sg));
        wait(0.55);
      } else {
        call(() => ballArc(hand(me), () => rimPos(), kind === 'three' ? 0.8 : 0.65, kind === 'three' ? 9 : 7, () => resolveShot(sg.made, sg.pts, sg.team, me, kind)));
        wait(kind === 'three' ? 0.95 : 0.8);
        call(() => { me.arms = sg.made ? (sg.team === 0 ? 'point' : 'idle') : 'idle'; });
      }
    } else if (kind === 'dunk') {
      call(() => { moveTo(me, HOOP.x + (me.x > 0 ? 0.8 : -0.8), HOOP.y + 1.6); me.spd = 18; });
      wait(0.25);
      call(() => { me.arms = 'dunk'; jump(me, 3.3, 0.7); if (blocker) { moveTo(blocker, me.x * 0.4, HOOP.y + 0.6); jump(blocker, 3.2, 0.6); blocker.arms = 'block'; } });
      wait(0.3);
      if (blocker) { call(() => blockBall(me, blocker, sg)); wait(0.55); }
      else {
        call(() => ballArc(hand(me), () => ({ x: HOOP.x, y: HOOP.y, z: HOOP.z }), 0.12, 0.2, () => resolveShot(sg.made, sg.pts, sg.team, me, 'dunk')));
        wait(0.5);
      }
      call(() => { me.spd = 9; me.arms = 'idle'; });
    } else {
      // layup / post / putback
      call(() => { if (kind !== 'putback') moveTo(me, HOOP.x + (me.x > 0 ? 2.5 : -2.5), HOOP.y + 3); });
      wait(kind === 'putback' ? 0.1 : 0.25);
      call(() => { me.arms = 'shoot'; jump(me, kind === 'putback' ? 2.4 : 2.2, 0.55); if (blocker) { moveTo(blocker, me.x * 0.6, me.y - 1); jump(blocker, 3, 0.55); blocker.arms = 'block'; } });
      wait(0.2);
      if (blocker) { call(() => blockBall(me, blocker, sg)); wait(0.55); }
      else {
        call(() => ballArc(hand(me), () => rimPos(), 0.42, 2.2, () => resolveShot(sg.made, sg.pts, sg.team, me, kind)));
        wait(0.6);
      }
      call(() => { me.arms = 'idle'; });
    }
  }

  function blockBall(shooter, blocker, sg) {
    const land = { x: blocker.x + (Math.random() < 0.5 ? -8 : 8), y: 10 + Math.random() * 10 };
    ballArc(hand(shooter), () => ({ x: land.x, y: land.y, z: 0.4 }), 0.5, 2, () => {});
    floater('REJECTED!', blocker.x, blocker.y, 10, sg.team === 1 ? '#38d996' : '#ff5a5a', 1.25);
    sfx('block');
    burst(shooter.x, shooter.y, 8, ['#ffffff', '#3aa8ff', '#ffd23f'], 14, 140);
    C.shake = Math.max(C.shake, 5);
    excite(sg.team === 1 ? 0.8 : 0.3, sg.team === 1);
  }

  function resolveShot(made, pts, team, shooter, kind) {
    if (made) {
      ballArc({ x: HOOP.x, y: HOOP.y, z: HOOP.z }, () => ({ x: HOOP.x, y: HOOP.y + 0.6, z: 0.5 }), 0.32, -0.2, () => { C.ball.flight = null; });
      C.net = 1;
      const home = team === 0;
      if (kind === 'dunk') {
        C.rimShake = 1; C.shake = Math.max(C.shake, 10); C.flash = 0.35;
        sfx('dunk');
        burst(HOOP.x, HOOP.y, HOOP.z, ['#ffd23f', '#ff6a1f', '#ffffff'], 30, 220);
        floater(U.pick(['SLAM!', 'POSTERIZED!', 'BOOM!', 'JAM!']), HOOP.x, HOOP.y, 14, '#ffd23f', 1.5);
      } else {
        sfx(Math.random() < 0.65 ? 'swish' : 'rimin');
        if (kind === 'three') { floater(Math.random() < 0.5 ? 'SPLASH!' : 'FROM DOWNTOWN!', HOOP.x, HOOP.y, 14, '#5cf2ff', 1.2); burst(HOOP.x, HOOP.y, HOOP.z, ['#5cf2ff', '#ffffff'], 16, 140); }
      }
      floater('+' + pts, shooter.x, shooter.y, 8.5, home ? '#38d996' : '#ff8a8a', 1);
      excite(home ? (kind === 'dunk' || kind === 'three' ? 1 : 0.7) : 0.25, home);
      if (home) shooter.celebrate = { t: 0, style: 'quick' };
    } else {
      sfx('rim');
      C.rimShake = 0.4;
      ballArc({ x: HOOP.x, y: HOOP.y, z: HOOP.z }, () => ({ x: HOOP.x + (Math.random() - 0.5) * 8, y: HOOP.y + 3 + Math.random() * 5, z: 8 }), 0.3, 1.5, () => {});
      if (team === 0) excite(0.1, false);
    }
  }

  function excite(v, cheer) {
    C.excite = Math.min(1.4, C.excite + v);
    if (cheer) sfx('cheer', { v: Math.min(1, v) });
    else if (v > 0.15) sfx('groan');
  }

  // Instant (non-featured) possession: small toast on the court
  function quickEvent(ev) {
    if (!ev || ev.pts <= 0) return;
    const team = ev.off;
    C.floaters.push({ text: (team === 0 ? '+' : 'Opp +') + ev.pts, x: C.W * (team === 0 ? 0.25 : 0.75), y: C.H * 0.42, t: 0, life: 0.8, color: team === 0 ? '#38d996' : '#ff8a8a', size: 0.7 });
  }

  function celebrate(winner, done) {
    C.tasks = [];
    call(() => {
      C.ball.holder = null;
      ballArc(ballPos(), () => ({ x: 0, y: 20, z: 0.4 }), 0.6, 3, () => {});
      for (const p of C.players) {
        if (p.team === winner) { p.celebrate = { t: 0, style: p.info.celebration || 'fist' }; p.arms = 'up'; moveTo(p, p.tx * 0.6, p.ty * 0.8 + 6); }
        else { p.slump = 1; p.arms = 'idle'; moveTo(p, p.tx, p.ty + 3); }
      }
      if (winner === 0) { confetti(C.reduceMotion ? 30 : 110); C.excite = 1.4; }
    });
    wait(2.4);
    call(() => { if (done) done(); });
  }
  function clearTasks() { C.tasks = []; }

  // ---------- Update ----------
  function update(dtReal) {
    const dt = Math.min(0.1, dtReal) * C.speed;
    C.time += dt;
    // tasks
    let budget = dt;
    let guard = 0;
    while (C.tasks.length && guard++ < 50) {
      const tk = C.tasks[0];
      if (!tk.started) { tk.started = true; if (tk.start) tk.start(); }
      const need = tk.dur - tk.t;
      if (budget >= need) { budget -= need; tk.t = tk.dur; if (tk.end) tk.end(); C.tasks.shift(); }
      else { tk.t += budget; budget = 0; break; }
    }
    // players
    for (const p of C.players) {
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.hypot(dx, dy);
      const step = p.spd * dt;
      if (d > 0.02) { const k = Math.min(1, step / d); p.x += dx * k; p.y += dy * k; p.phase += dt * 14; p.moving = true; }
      else p.moving = false;
      if (p.jumpT >= 0) {
        p.jumpT += dt / p.jumpDur;
        p.z = Math.sin(Math.min(1, p.jumpT) * Math.PI) * p.jumpH;
        if (p.jumpT >= 1) { p.jumpT = -1; p.z = 0; }
      }
      if (p.celebrate) {
        p.celebrate.t += dt;
        const st = p.celebrate.style;
        if (st === 'quick') { if (p.celebrate.t > 0.6) p.celebrate = null; }
        else if (p.jumpT < 0 && (st === 'fist' || st === 'sky' || st === 'flip' || st === 'flex')) jump(p, st === 'flip' ? 3 : 1.6, st === 'flip' ? 0.7 : 0.45);
      }
      if (p.slump > 0 && !C.match) p.slump = 0;
    }
    // ball
    const b = C.ball;
    if (b) {
      if (b.flight) {
        const f = b.flight;
        f.t += dt / f.dur;
        const to = typeof f.to === 'function' ? f.to() : f.to;
        const k = Math.min(1, f.t);
        b.x = U.lerp(f.from.x, to.x, k); b.y = U.lerp(f.from.y, to.y, k);
        b.z = U.lerp(f.from.z, to.z, k) + Math.sin(k * Math.PI) * f.peak;
        if (f.t >= 1) { b.flight = null; const cb = f.onLand; if (cb) cb(); }
      } else if (b.holder) {
        const h = hand(b.holder);
        b.x = h.x; b.y = h.y;
        if (b.holder.arms === 'dribble' || (b.holder.moving && b.holder.arms !== 'shoot' && b.holder.arms !== 'dunk')) {
          const ph = (C.time * 3.2) % 1;
          b.z = 0.5 + Math.abs(Math.cos(ph * Math.PI)) * 2.3;
          if (ph < b.lastPh) sfx('bounce', { v: 0.5 });
          b.lastPh = ph;
        } else b.z = h.z;
      } else if (b.z > 0.45) { b.z = Math.max(0.45, b.z - dt * 20); }
    }
    // fx decay
    C.excite = Math.max(0.2, C.excite - dtReal * 0.25);
    C.shake = Math.max(0, C.shake - dtReal * 30);
    C.net = Math.max(0, C.net - dtReal * 2.5);
    C.rimShake = Math.max(0, C.rimShake - dtReal * 2.5);
    C.flash = Math.max(0, C.flash - dtReal * 1.6);
    for (const p of C.particles) {
      p.t += dtReal; p.vy += p.g * dtReal; p.x += p.vx * dtReal; p.y += p.vy * dtReal;
      if (p.conf) { p.rot += dtReal * 6; p.vx += Math.sin(C.time * 3 + p.rot) * 20 * dtReal; }
    }
    C.particles = C.particles.filter((p) => p.t < p.life && p.y < C.H + 20);
    for (const f of C.floaters) f.t += dtReal;
    C.floaters = C.floaters.filter((f) => f.t < f.life);
    if (C.banner) { C.banner.t += dtReal; if (C.banner.t > C.banner.life) C.banner = null; }
  }

  // ---------- Draw ----------
  function draw() {
    const g = C.ctx;
    if (!g || !C.bg) return;
    g.setTransform(C.dpr, 0, 0, C.dpr, 0, 0);
    const sh = C.reduceMotion ? 0 : C.shake;
    const ox = (Math.random() - 0.5) * sh, oy = (Math.random() - 0.5) * sh;
    g.save();
    g.translate(ox, oy);
    g.drawImage(C.bg, 0, 0, C.W, C.H);
    drawCrowd(g);
    drawHoopBack(g);
    const ents = C.players.slice().sort((a, b) => a.y - b.y);
    const b = C.ball;
    const ballNearRim = b && b.y < 7 && b.z > 8.5;
    for (const p of ents) drawPlayer(g, p);
    if (b && b.vis && !ballNearRim) drawBall(g, b);
    if (ballNearRim) drawBall(g, b);
    drawHoopFront(g);
    // particles
    for (const p of C.particles) {
      const a = 1 - p.t / p.life;
      g.globalAlpha = Math.max(0, a);
      g.fillStyle = p.c;
      if (p.conf) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); g.restore(); }
      else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill(); }
    }
    g.globalAlpha = 1;
    for (const f of C.floaters) {
      const k = f.t / f.life;
      const sc = (0.6 + U.easeOutBack(Math.min(1, f.t * 4)) * 0.6) * f.size;
      g.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      g.font = '400 ' + Math.round(22 * sc) + 'px "Bebas Neue", Impact, sans-serif';
      g.textAlign = 'center';
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.65)';
      g.strokeText(f.text, f.x, f.y - k * 26);
      g.fillStyle = f.color;
      g.fillText(f.text, f.x, f.y - k * 26);
    }
    g.globalAlpha = 1;
    if (C.banner) {
      const bn = C.banner, k = bn.t / bn.life;
      const a = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
      g.globalAlpha = a;
      g.fillStyle = 'rgba(8,10,20,.72)';
      g.fillRect(0, C.H * 0.42 - 26, C.W, 52);
      g.font = '400 30px "Bebas Neue", Impact, sans-serif'; g.textAlign = 'center';
      g.fillStyle = bn.color || '#ffd23f';
      g.fillText(bn.text, C.W / 2, C.H * 0.42 + 4);
      if (bn.sub) { g.font = '600 12px "Barlow Condensed", sans-serif'; g.fillStyle = '#fff'; g.fillText(bn.sub, C.W / 2, C.H * 0.42 + 20); }
      g.globalAlpha = 1;
    }
    g.restore();
    if (C.flash > 0) { g.fillStyle = 'rgba(255,240,200,' + C.flash * 0.5 + ')'; g.fillRect(0, 0, C.W, C.H); }
  }
  function showBanner(text, sub, color, life) { C.banner = { text, sub, color, t: 0, life: life || 1.8 }; }

  function drawCrowd(g) {
    const ex = C.excite;
    for (const c of C.crowd) {
      const bob = C.reduceMotion ? 0 : Math.max(0, Math.sin(C.time * (2 + ex * 6) + c.ph)) * c.amp * ex * c.r * 0.9;
      const y = c.y - bob;
      g.fillStyle = c.shirt; g.fillRect(c.x - c.r * 1.1, y + c.r * 0.6, c.r * 2.2, c.r * 1.8);
      g.fillStyle = c.skin; g.beginPath(); g.arc(c.x, y, c.r, 0, 6.283); g.fill();
      if (ex > 0.9 && c.ph > 4.5) { g.strokeStyle = c.skin; g.lineWidth = c.r * 0.5; g.beginPath(); g.moveTo(c.x - c.r, y + c.r); g.lineTo(c.x - c.r * 1.6, y - c.r * 1.2); g.moveTo(c.x + c.r, y + c.r); g.lineTo(c.x + c.r * 1.6, y - c.r * 1.2); g.stroke(); }
    }
  }

  function drawHoopBack(g) {
    const pole0 = proj(0, -1.2, 0), pole1 = proj(0, -1.2, 11.5), arm = proj(0, 3.6, 11.5);
    g.strokeStyle = '#2a2f3a'; g.lineWidth = Math.max(3, pole0.s * 0.5);
    g.beginPath(); g.moveTo(pole0.x, pole0.y); g.lineTo(pole1.x, pole1.y); g.lineTo(arm.x, arm.y); g.stroke();
    // backboard
    const rs = C.rimShake * Math.sin(C.time * 60) * 0.15;
    const tl = proj(-3 + rs, 4, 13.5), br = proj(3 + rs, 4, 9.6);
    g.fillStyle = C.theme.stands === 'fence' ? 'rgba(235,235,235,.95)' : 'rgba(220,240,255,.55)';
    g.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    const s1 = proj(-1, 4, 11.5), s2 = proj(1, 4, 10);
    g.strokeStyle = '#e8263f'; g.lineWidth = 2; g.strokeRect(s1.x, s1.y, s2.x - s1.x, s2.y - s1.y);
    // back rim
    const r = proj(HOOP.x, HOOP.y, HOOP.z + rs * 3);
    g.strokeStyle = '#ff5a1f'; g.lineWidth = Math.max(2, r.s * 0.18);
    g.beginPath(); g.ellipse(r.x, r.y, r.s * 0.78, r.s * 0.26, 0, Math.PI, 2 * Math.PI); g.stroke();
  }
  function drawHoopFront(g) {
    const rs = C.rimShake * Math.sin(C.time * 60) * 0.15;
    const r = proj(HOOP.x, HOOP.y, HOOP.z + rs * 3);
    const w = r.s * 0.78, h = r.s * 0.26;
    // net
    const sway = C.net * Math.sin(C.time * 30) * r.s * 0.12;
    const depth = r.s * (1.5 + C.net * 0.4);
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
    const n = 8;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI * i / n;
      const x0 = r.x - Math.cos(a) * w, y0 = r.y + Math.sin(a) * h;
      const x1 = r.x - Math.cos(a) * w * 0.55 + sway, y1 = r.y + depth + Math.sin(a) * h * 0.5;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
    for (let k = 1; k <= 3; k++) {
      const t = k / 3.5;
      g.beginPath(); g.ellipse(r.x + sway * t, r.y + depth * t, w * (1 - 0.45 * t), h * (1 - 0.4 * t), 0, 0, Math.PI); g.stroke();
    }
    g.strokeStyle = '#ff5a1f'; g.lineWidth = Math.max(2, r.s * 0.18);
    g.beginPath(); g.ellipse(r.x, r.y, w, h, 0, 0, Math.PI); g.stroke();
  }

  function drawBall(g, b) {
    const sp = proj(b.x, b.y, 0);
    const p = proj(b.x, b.y, b.z);
    const r = Math.max(3, p.s * 0.48);
    g.fillStyle = 'rgba(0,0,0,' + (0.35 - Math.min(0.25, b.z * 0.02)) + ')';
    g.beginPath(); g.ellipse(sp.x, sp.y, r * (1 - Math.min(0.5, b.z * 0.04)), r * 0.35, 0, 0, 6.283); g.fill();
    drawBallAt(g, p.x, p.y, r, C.time * 6);
  }
  function drawBallAt(g, x, y, r, rot) {
    const grd = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    grd.addColorStop(0, '#ffb066'); grd.addColorStop(1, '#d9531e');

          '<button class="btn gold wide" style="margin-top:10px" data-tour="enter"' + (s.tourney.entries >= 3 ? ' disabled' : '') + '>Enter tournament</button></div>';
        if (s.tourney.lastResult) {
          const lr = s.tourney.lastResult;
          html += '<div class="sec-title"><span class="h3">Last run: ' + lr.placement + '</span><span class="label">+' + lr.pts + ' pts</span></div><div class="col">' +
            lr.results.map((r) => '<div class="lb-row"><span class="rk" style="font-size:14px;color:' + (r.won ? 'var(--good)' : 'var(--bad)') + '">' + (r.won ? 'W' : 'L') + '</span><span>' + r.round + ' vs ' + U.esc(r.opp) + '</span><span class="num">' + r.score[0] + '-' + r.score[1] + '</span></div>').join('') + '</div>';
        }
        html += '<div class="small muted" style="margin-top:8px">Opponents are simulated franchises scaled to your current stage. Tournament points set your league tier for the week.</div>';
      } else {
        const wc = weeklyChallenge(s);
        const we = weekendEvent(s);
        html += '<div class="card"><div class="label" style="color:var(--accent)">Weekly challenge · ends in ' + U.fmtTime(U.msUntilNextWeek() / 1000) + '</div><div class="h3" style="margin:4px 0">' + wc.c.text + '</div><div class="bar green"><i style="width:' + Math.min(100, wc.prog / wc.c.goal * 100) + '%"></i></div><div class="row between" style="margin-top:6px"><span class="small">' + Math.min(wc.prog, wc.c.goal) + '/' + wc.c.goal + '</span><span class="small">' + ui.rewardPreview({ gems: 60, eventTickets: 2, tickets: 1 }) + '</span></div>' +
          (wc.st.claimed ? '<span class="chip good">Claimed</span>' : '<button class="btn gold sm wide" style="margin-top:8px" data-ch="week"' + (wc.prog >= wc.c.goal ? '' : ' disabled') + '>Claim</button>') + '</div>';
        const wprog = we.base === null ? 0 : s.stats.wins - we.base;
        html += '<div class="card" style="margin-top:10px"><div class="label" style="color:var(--gold)">Weekend Showdown · Sat–Sun</div><div class="h3" style="margin:4px 0">Win 40 games over the weekend</div>' +

            (we.claimed ? '<span class="chip good">Claimed</span>' : '<button class="btn gold sm wide" style="margin-top:8px" data-ch="weekend"' + (wprog >= 40 ? '' : ' disabled') + '>Claim</button>')

      const s = S();
      const t = e.target.closest('[data-et]');
      if (t) { tab = t.dataset.et; draw(m); return; }
      const c = e.target.closest('[data-contest]');
      if (c) { if (s.events.attempts[c.dataset.contest] <= 0) return; s.events.attempts[c.dataset.contest]--; BE.contests.play(c.dataset.contest, () => draw(m)); return; }
      const ca = e.target.closest('[data-contestad]');
      if (ca) {
        if ((s.ads.counts.contest || 0) >= D.ads.contest.daily) return;
        const r = await BE.services.rewardedAd('contest');
        if (!r.ok) return;
        s.ads.counts.contest = (s.ads.counts.contest || 0) + 1;
        s.events.attempts[ca.dataset.contestad]++;
        draw(m); return;

      if (e.target.closest('[data-tour]')) { runTourney(() => draw(m)); return; }
      const ch = e.target.closest('[data-ch]');
      if (ch) {
        if (ch.dataset.ch === 'week') { const wc = weeklyChallenge(s); if (wc.st.claimed || wc.prog < wc.c.goal) return; wc.st.claimed = true; ui.rewardsPopup('CHALLENGE COMPLETE', E.grant(s, { gems: 60, eventTickets: 2, tickets: 1 })); }
        else { const we = weekendEvent(s); if (we.claimed) return; we.claimed = true; ui.rewardsPopup('WEEKEND CHAMPION', E.grant(s, { gems: 80, eventTickets: 3 })); }
        changed(); draw(m);
      }
    });
  }

  async function runTourney(done) {
    const s = S();
    const r = G.runTournament(s);
    if (!r.ok) { ui.toast(r.reason, 'bad', 'x'); return; }
    const m = ui.modal({ title: 'Weekly Invitational', center: true, noClose: true, html: '<div class="col" data-tr></div><div data-tr2 style="margin-top:10px"></div>' });
    const list = $('[data-tr]', m.el);
    for (let i = 0; i < r.results.length; i++) {
      await new Promise((res) => setTimeout(res, 650));
      const x = r.results[i];
      list.insertAdjacentHTML('beforeend', '<div class="lb-row" style="animation:popIn .3s"><span class="rk" style="font-size:14px;color:' + (x.won ? 'var(--good)' : 'var(--bad)') + '">' + (x.won ? 'W' : 'L') + '</span><span>' + x.round + ' vs ' + U.esc(x.opp) + '</span><span class="num">' + x.score[0] + '-' + x.score[1] + '</span></div>');
      BE.audio.play(x.won ? 'cheer' : 'groan', { v: 0.6 });
    }
    await new Promise((res) => setTimeout(res, 500));
    if (r.wins === 4) { BE.audio.play('champion'); BE.court.confetti(80); } else BE.audio.play('claim');
    const adLeft = (s.ads.counts.tourney || 0) < D.ads.tourney.daily;
    $('[data-tr2]', m.el).innerHTML = '<div style="text-align:center"><div class="h1" style="color:var(--gold)">' + r.placement.toUpperCase() + '</div><div class="small muted">+' + r.pts + ' league points</div><div class="row wrap" style="justify-content:center;margin:8px 0">' + r.granted.map((g) => ui.rewChip(g.k, g.v)).join(' ') + '</div>' +
      '<div class="row">' + (adLeft ? '<button class="btn green grow" data-tad>' + icon('tv') + ' Double rewards</button>' : '') + '<button class="btn gold grow" data-tdone>Collect</button></div></div>';
    m.el.addEventListener('click', async (e) => {
      if (e.target.closest('[data-tdone]')) { m.close(); ui.flyCurrency('cash', null, 6); done && done(); changed(); }
      if (e.target.closest('[data-tad]')) {
        const rr = await BE.services.rewardedAd('tourney');
        if (!rr.ok) return;
        s.ads.counts.tourney = (s.ads.counts.tourney || 0) + 1;
        E.grant(s, { cash: r.reward.cash, gems: r.reward.gems, eventTickets: r.reward.eventTickets });
        ui.toast('Tournament rewards doubled!', 'gold', 'trophy');
        e.target.closest('[data-tad]').remove();
      }
    });
    s.stats.contests += 0;
  }

        html += '<div class="card" data-showcase style="background:linear-gradient(160deg,' + cos.jersey[1] + ',#0a0e1d)"><div class="row">' + ui.crestHTML(s) + '<div class="grow"><div class="h2">' + U.esc(s.franchise.name) + '</div><div class="small muted">World ' + (E.worldOf(s.best) + 1) + ' · ' + s.stats.championships + ' titles · ★' + s.prestige.count + ' dynasties</div></div></div>' +

      const j = e.target.closest('[data-join]');

      if (e.target.closest('[data-leave]')) { const ok = await ui.confirmBox('Leave alliance?', '<div>Your weekly contribution resets.</div>', 'Leave'); if (ok) { s.social.alliance = null; s.social.contributed = 0; s.social.claimed = []; draw(m); } return; }
      const ch = e.target.closest('[data-chest]');
      if (ch) {
        const i = +ch.dataset.chest;

        s.social.claimed.push(i);

      }
    });
  }

  // ---------- Tactics ----------
  function tacticsModal() {
    const m = ui.modal({ title: 'Tactics', render: (mm) => draw(mm) });
    function draw(mm) {
      const s = S();
      const opp = G.oppTeam(s, G.target(s).g, G.target(s).mode === 'champ' ? G.target(s).round : undefined);
      const scouted = (s.facilities.scouting || 0) > 0 || (s.coaches.analytics || 0) > 0;
      let html = '<div class="card flat" style="margin-bottom:10px"><div class="label">Scouting report · ' + U.esc(opp.name) + '</div>' +
        (scouted ? '<div style="margin-top:4px">Offense: <b>' + D.tactics.off.find((x) => x.k === opp.style.off).name + '</b> · Defense: <b>' + D.tactics.def.find((x) => x.k === opp.style.def).name + '</b></div>' : '<div class="small muted" style="margin-top:4px">' + icon('lock') + ' Build the Scouting Department to reveal opponent styles.</div>') + '</div>';
      html += '<div class="small muted" style="margin-bottom:8px">A counter gives +' + Math.round(E.mods(s).sim.tactic * 100) + '% effectiveness on that side of the ball.</div>';
      for (const side of ['off', 'def']) {
        html += '<div class="h3" style="margin:8px 0 6px">' + (side === 'off' ? 'Offense' : 'Defense') + '</div><div class="col" style="gap:6px">';
        for (const t of D.tactics[side]) {
          const sel = s.tactics[side] === t.k;
          const good = scouted && (side === 'off' ? D.offCounters[t.k] === opp.style.def : D.defCounters[t.k] === opp.style.off);
          html += '<button class="urow" data-tac="' + side + ':' + t.k + '" style="text-align:left;' + (sel ? 'border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)' : '') + '"><div class="ut"><div class="n">' + t.name + (good ? ' <span class="chip good">Counter</span>' : '') + '</div><div class="d">' + t.desc + '</div></div>' + (sel ? '<span class="chip gold">Active</span>' : '') + '</button>';
        }
        html += '</div>';
      }
      if ((s.coaches.analytics || 0) > 0 || s.purchases.autocoach) html += '<div class="row between card flat" style="margin-top:10px"><span>Auto-pick counters each game</span><button class="toggle' + (s.settings.autoTactics ? ' on' : '') + '" data-autotac aria-label="Auto tactics"></button></div>';
      mm.set(html);
    }
    m.el.addEventListener('click', (e) => {
      const s = S();
      const t = e.target.closest('[data-tac]');
      if (t) { const [side, k] = t.dataset.tac.split(':'); s.tactics[side] = k; s.settings.autoTactics = false; if (BE.play.R.match) BE.play.R.match.teams[0].tactic = { off: s.tactics.off, def: s.tactics.def }; BE.audio.play('click'); draw(m); return; }
      if (e.target.closest('[data-autotac]')) { s.settings.autoTactics = !s.settings.autoTactics; draw(m); }
    });
  }

        BE.play.updateIncome();
        ui.updateBadges(s);
        if (s.tutorial.step === 1 && !s.tutorial.done && !document.querySelector('.spot') && BE.play.R.match && BE.play.R.match.energy >= 40) tutorial.show();
        const msgs = G.resets(s);
        for (const msg of msgs) ui.toast(msg, 'gold', 'gift');
        BE.play.renderObjective();
        if (BE.growth) BE.growth.refresh();
      }
      if (introAcc >= 2) { introAcc = 0; BE.meta.checkFeatureIntros(); }
      if (refreshAcc >= 2 && ui.current() !== 'play' && performance.now() - main.lastPointer > 800 && !ui.anyModal()) { refreshAcc = 0; ui.renderScreen(ui.current()); }
      if (main.dirty && ui.current() !== 'play' && performance.now() - main.lastPointer > 300) { main.dirty = false; }
      if (saveAcc >= 5) { saveAcc = 0; save(); }
      if (cloudAcc >= 45) { cloudAcc = 0; saveCloud(); }
    }
    requestAnimationFrame(frame);
  }

  // ---------- Offline ----------
  function runOffline(seconds) {
    const s = S();
    if (!s || seconds < 60 || !s.tutorial.done) return;
    const res = G.offline(s, seconds);
    if (res.games > 0 || res.cash > 0) BE.meta.offlineModal(res);
    ui.renderHUD(s);
    BE.play.restartMatch();
  }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (!main.started) return;
    if (document.hidden) { hiddenAt = Date.now(); save(); saveCloud(); BE.audio.suspend(true); }
    else {
      BE.audio.suspend(false);
      const away = (Date.now() - (hiddenAt || Date.now())) / 1000;
      lastFrame = performance.now();
      if (away >= 60) runOffline(away);
      else if (away > 1) G.tick(S(), away);
    }
  });
  root.addEventListener('pagehide', () => { save(); saveCloud(); });
  root.addEventListener('resize', () => BE.court.resize());
  document.addEventListener('pointerdown', () => { main.lastPointer = performance.now(); }, true);

  // ---------- Boot ----------
  function shell() {
    const app = $('#app');
    app.innerHTML = '<header id="hud"></header><section id="arena"></section><main id="screens"><section class="screen active" id="scr-play"></section><section class="screen" id="scr-team"></section><section class="screen" id="scr-recruit"></section><section class="screen" id="scr-empire"></section><section class="screen" id="scr-shop"></section></main><nav id="nav"></nav>';
    document.addEventListener('click', dispatch);
  }

  function splash(onStart) {
    const sp = document.createElement('div');
    sp.className = 'splash';
    sp.innerHTML = '<div class="logo">' + ui.ballArt + '<div class="t1">BASKETBALL</div><div class="t2">EMPIRE</div><div class="muted" style="margin-top:18px;font-family:var(--cond);letter-spacing:2px" data-sp>LOADING<span class="loading-dots"></span></div></div>';
    document.body.appendChild(sp);
    const ready = () => {
      const t = $('[data-sp]', sp);
      t.innerHTML = '<button class="btn gold" style="min-width:200px;min-height:56px;font-size:22px" data-go>TAP TO PLAY</button>';
      $('[data-go]', sp).addEventListener('click', () => {
        BE.audio.ensure();
        applySettings();
        BE.audio.play('buzzer');
        sp.style.transition = 'opacity .35s'; sp.style.opacity = '0';
        setTimeout(() => sp.remove(), 360);
        onStart();
      });
    };
    return ready;
  }

  async function boot(hotData) {
    shell();
    let raw = (hotData && hotData.save) ? JSON.parse(hotData.save) : ST.store.loadLocal();
    BE.game_state = ST.load(raw);
    const isNew = !raw;
    const s0 = S();
    const awaySec = isNew ? 0 : (Date.now() - s0.lastSeen) / 1000;
    G.resets(s0);
    applySettings();
    ui.renderHUD(s0); ui.renderNav(s0);
    BE.play.renderPlay();
    BE.services.init();
    const ready = splash(() => {
      main.started = true;
      main.sessionStart = Date.now();
      lastFrame = performance.now();
      const s = S();
      if (!s.tutorial.done && s.tutorial.step === 0) tutorial.intro();
      else if (!s.tutorial.done) tutorial.show();
      else if (awaySec >= 60 && !hotData) runOffline(awaySec);
      // daily login nudge
      setTimeout(() => { const st = S(); if (st.tutorial.done && E.unlocked(st, 'daily') && !G.loginStatus(st).claimedToday && !ui.anyModal()) BE.meta.dailyModal(); }, 1500);
    });
    requestAnimationFrame(frame);
    // Optional cloud save (claude.ai per-viewer storage). Never blocks play.
    const cloudP = ST.store.initCloud().then((cloudRaw) => {
      if (cloudRaw && (!raw || (cloudRaw.lastSeen || 0) > (S().lastSeen || 0) + 5000)) {
        const ns = ST.load(cloudRaw);
        BE.game_state = ns;
        E.invalidate(); G.resets(ns); applySettings();
        ui.renderHUD(ns); ui.renderNav(ns);
        BE.play.restartMatch();
        ui.renderScreen(ui.current());
        if (main.started) ui.toast('Cloud save loaded', 'good', 'check');
        return 'cloud';
      }
      if (ST.store.cloud.ready) saveCloud();
      return 'local';
    }).catch(() => 'local');
    await Promise.race([cloudP, new Promise((r) => setTimeout(r, 1200))]);
    ready();
  }

  // Hot-update support for the claude.ai viewer: carry the save across a republish
  try {
    const hot = root.claude && root.claude.hot;
    if (hot && hot.snapshot) hot.snapshot(() => ({ save: S() ? ST.serialize(S()) : null }));
  } catch (e) { /* not in a viewer */ }

  main.save = save;
  main.runOffline = runOffline;
  main.replaceState = replaceState;
  main.resetAll = resetAll;
  main.boot = boot;
  BE.main = main;

  function start() {
    const hot = root.claude && root.claude.hot;
    if (hot && hot.ready) hot.ready((data) => boot(data && data.save ? data : null));
    else boot(hot && hot.data && hot.data.save ? hot.data : null);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
